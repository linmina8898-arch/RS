<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>RS專車接送 詢價/預約</title>
  
  <script src="https://cdn.tailwindcss.com"></script>
  <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
  <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  
  <script>
    window.require = function(name) {
      if (name === 'react') return window.React;
      if (name === 'react-dom') return window.ReactDOM;
      return null;
    };
    window.module = { exports: {} };
    window.exports = window.module.exports;
    window.define = undefined;
  </script>

  <script src="https://unpkg.com/lucide-react@0.344.0/dist/umd/lucide-react.js"></script>

  <script>
    if (!window.lucideReact && window.module && window.module.exports && window.module.exports.Calendar) {
      window.lucideReact = window.module.exports;
    }
  </script>

  <script charset="utf-8" src="https://static.line-scdn.net/liff/edge/2/sdk.js"></script>
  <style>
    .justify-text {
      text-align: justify;
      text-justify: inter-ideograph;
    }
  </style>
</head>
<body class="bg-gray-50 text-black font-sans">
  
  <div id="root"></div>

  <script type="text/babel">
    const { useState, useEffect, useMemo, useRef } = React;
    
    const FallbackIcon = () => <span></span>;
    const { 
      Calendar = FallbackIcon, Clock = FallbackIcon, MapPin = FallbackIcon, Phone = FallbackIcon, User = FallbackIcon, Plane = FallbackIcon, Car = FallbackIcon, 
      Briefcase = FallbackIcon, Users = FallbackIcon, CreditCard = FallbackIcon, Mail = FallbackIcon, FileText = FallbackIcon, CheckCircle = FallbackIcon, 
      ShieldAlert = FallbackIcon, Receipt = FallbackIcon, Database = FallbackIcon, Send = FallbackIcon, RefreshCw = FallbackIcon, Search = FallbackIcon, X = FallbackIcon, AlertCircle = FallbackIcon
    } = window.lucideReact || {};

    const GAS_WEBAPP_URL = 'https://script.google.com/macros/s/AKfycbxwE2pYFk4VS9Vjus6a6Xp24CaTTrxblbUqmEb3ituiK-vrNanH4mN44eotKrSf0Yo92A/exec';
    const GOOGLE_MAPS_API_KEY = 'AIzaSyAxYym5ZR8puPb0iiycHdwzTJTKH0Aears';
    const LINE_LIFF_ID = '2009753964-IEeYinij';

    const DISTRICTS_FALLBACK = {
      "台北市": ["100 中正區", "103 大同區", "104 中山區", "105 松山區", "106 大安區", "108 萬華區", "110 信義區", "111 士林區", "112 北投區", "114 內湖區", "115 南港區", "116 文山區"],
      "新北市": ["207 萬里區", "208 金山區", "220 板橋區", "221 汐止區", "222 深坑區", "223 石碇區", "224 瑞芳區", "226 平溪區", "227 雙溪區", "228 貢寮區", "231 新店區", "232 坪林區", "233 烏來區", "234 永和區", "235 中和區", "236 土城區", "237 三峽區", "238 樹林區", "239 鶯歌區", "241 三重區", "242 新莊區", "243 泰山區", "244 林口區", "247 蘆洲區", "248 五股區", "249 八里區", "251 淡水區", "252 三芝區", "253 石門區"],
      "桃園市": ["320 中壢區", "324 平鎮區", "325 龍潭區", "326 楊梅區", "327 新屋區", "328 觀音區", "330 桃園區", "333 龜山區", "334 八德區", "338 蘆竹區", "337 大園區", "335 大溪區", "336 復興區"]
    };

    const generateReservationId = () => {
      const dateStr = new Date().toISOString().slice(0, 10).replace(/-/g, '');
      const randomDigits = Math.floor(1000 + Math.random() * 9000);
      return `RS${dateStr}${randomDigits}`;
    };

    function CustomModal({ isOpen, onClose, title, message, type = 'info' }) {
      if (!isOpen) return null;
      return (
        <div className="fixed inset-0 z-[999] flex items-center justify-center p-4 bg-black/60 backdrop-blur-sm">
          <div className="bg-white w-full max-w-sm rounded-lg shadow-2xl overflow-hidden">
            <div className="bg-black p-4 flex justify-between items-center text-white">
              <div className="flex items-center gap-2 font-bold tracking-wider uppercase text-sm">
                {type === 'error' ? <AlertCircle className="w-4 h-4 text-red-500" /> : <CheckCircle className="w-4 h-4 text-green-500" />}
                {title}
              </div>
              <button onClick={onClose}><X className="w-5 h-5 opacity-70 hover:opacity-100" /></button>
            </div>
            <div className="p-6 text-center">
              <p className="text-gray-700 leading-relaxed font-bold mb-6 whitespace-pre-wrap justify-text">{message}</p>
              <button 
                onClick={onClose}
                className="w-full py-3 bg-black text-white font-black rounded-sm active:scale-95 transition-transform"
              >
                確定
              </button>
            </div>
          </div>
        </div>
      );
    }

    function App() {
      const [reservationId] = useState(generateReservationId());
      const [name, setName] = useState('');
      const [title, setTitle] = useState('先生');
      const [phone, setPhone] = useState('');
      const [date, setDate] = useState('');
      const [timeHour, setTimeHour] = useState('12');
      const [timeMinute, setTimeMinute] = useState('00');
      const [serviceType, setServiceType] = useState('送機');
      const [flightNumber, setFlightNumber] = useState('');
      const [airport, setAirport] = useState('桃園機場');
      const [carType, setCarType] = useState('小車');
      const [carryOn, setCarryOn] = useState(0);
      const [checkedBag, setCheckedBag] = useState(0);
      const [district, setDistrict] = useState('');
      const [address, setAddress] = useState('');
      const [adults, setAdults] = useState(1);
      const [children, setChildren] = useState(0);
      const [infants, setInfants] = useState(0);
      const [payment, setPayment] = useState('現金');
      const [remarks, setRemarks] = useState('');
      const [agreed, setAgreed] = useState(false);
      const [extraSignboard, setExtraSignboard] = useState(false);
      const [signboardText, setSignboardText] = useState('');
      const [extraMultiPoint, setExtraMultiPoint] = useState(false);

      const [priceMap, setPriceMap] = useState({});
      const [isLoadingPrices, setIsLoadingPrices] = useState(false);
      const [isSubmitting, setIsSubmitting] = useState(false);
      const [mapsError, setMapsError] = useState(false);
      const [showDistrictList, setShowDistrictList] = useState(false);
      const [modal, setModal] = useState({ open: false, title: '', message: '', type: 'info' });

      const addressInputRef = useRef(null);

      const showAlert = (msg, title = '系統訊息', type = 'info') => {
        setModal({ open: true, title, message: msg, type });
      };

      const handleFlightChange = (e) => {
        setFlightNumber(e.target.value.replace(/[^a-zA-Z0-9]/g, '').toUpperCase());
      };

      useEffect(() => {
        if (window.liff) {
          window.liff.init({ liffId: LINE_LIFF_ID }).then(() => console.log('LIFF Ready')).catch(err => console.error(err));
        }
        window.gm_authFailure = () => {
          setMapsError(true);
          showAlert("【地圖授權異常】目前環境受到 Google API 網域限制，地址自動建議功能暫時停用，請手動輸入。", "系統提示", "error");
        };
      }, []);

      useEffect(() => {
        const initAutocomplete = () => {
          if (addressInputRef.current && window.google && window.google.maps && window.google.maps.places) {
            const autocomplete = new window.google.maps.places.Autocomplete(addressInputRef.current, {
              types: ['geocode', 'establishment'],
              componentRestrictions: { country: 'tw' }
            });
            autocomplete.addListener('place_changed', () => {
              const place = autocomplete.getPlace();
              if (place.formatted_address) {
                setAddress(place.formatted_address.replace(/^台灣\d{3,5}\s*/, ''));
              }
            });
          }
        };
        if (!window.google) {
          const script = document.createElement('script');
          script.src = `https://maps.googleapis.com/maps/api/js?key=${GOOGLE_MAPS_API_KEY}&libraries=places&language=zh-TW`;
          script.async = true;
          script.defer = true;
          script.onload = initAutocomplete;
          document.head.appendChild(script);
        } else {
          initAutocomplete();
        }
      }, []);

      useEffect(() => {
        fetchPrices();
      }, []);

      const fetchPrices = async () => {
        if (GAS_WEBAPP_URL.includes('YOUR_GAS_ID')) return;
        setIsLoadingPrices(true);
        try {
          const response = await fetch(`${GAS_WEBAPP_URL}?action=getPrices`);
          const data = await response.json();
          if (data.status === 'success') setPriceMap(data.prices);
        } catch (err) { console.error(err); } finally { setIsLoadingPrices(false); }
      };

      const handlePhoneChange = (e) => {
        let val = e.target.value.replace(/\D/g, '').slice(0, 10);
        let formatted = val;
        if (val.length > 7) formatted = `${val.slice(0, 4)}-${val.slice(4, 7)}-${val.slice(7)}`;
        else if (val.length > 4) formatted = `${val.slice(0, 4)}-${val.slice(4)}`;
        setPhone(formatted);
      };

      useEffect(() => {
        const totalLuggage = Number(carryOn) + Number(checkedBag);
        const totalPassengers = Number(adults) + Number(children) + Number(infants);
        if (totalLuggage >= 3 || totalPassengers >= 5) setCarType('大車');
      }, [carryOn, checkedBag, adults, children, infants]);

      const basePrice = useMemo(() => {
        const key = `${airport}_${district}`;
        const priceData = priceMap[key];
        if (!priceData) return 0;
        return carType === '大車' ? priceData.large : priceData.small;
      }, [priceMap, airport, district, carType]);

      const isNightCharge = parseInt(timeHour) >= 22 || parseInt(timeHour) < 6;
      const totalExtraFee = (serviceType === '接機' ? 200 : 0) + (isNightCharge ? 200 : 0) + (infants * 200) + (extraSignboard ? 200 : 0);
      const estimatedTotal = basePrice > 0 ? basePrice + totalExtraFee : null;

      const handleSubmit = async (e) => {
        e.preventDefault();
        if (!agreed || isSubmitting) return;
        const phoneDigits = phone.replace(/\D/g, '');
        if (phoneDigits.length !== 10 || !phoneDigits.startsWith('09')) {
          showAlert('請輸入 09 開頭的完整 10 碼電話！', '格式錯誤', 'error');
          return;
        }

        setIsSubmitting(true);
        const finalRemarks = extraSignboard && signboardText ? `【舉牌內容：${signboardText}】\n${remarks}` : remarks;
        const payload = {
          action: 'addReservation',
          data: {
            reservationId, name: `${name} ${title}`, phone, dateTime: `${date} ${timeHour}:${timeMinute}`,
            serviceType, airport, flightNumber, location: `${district} ${address}`, carType,
            passengers: `成人:${adults}, 小孩:${children}, 幼童:${infants}`,
            luggage: `登機箱:${carryOn}, 託運:${checkedBag}`,
            payment, totalFee: estimatedTotal || '待報價', remarks: finalRemarks,
            timestamp: new Date().toLocaleString('zh-TW')
          }
        };

        try {
          await fetch(GAS_WEBAPP_URL, { method: 'POST', mode: 'no-cors', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(payload) });
          if (window.liff && window.liff.isInClient()) {
            await window.liff.sendMessages([{
              type: 'text',
              text: `【RS專車接送 線上預約單】\n預約編號：${reservationId}\n乘車人：${name} ${title}\n聯絡電話：${phone}\n乘車時間：${date} ${timeHour}:${timeMinute}\n服務類型：${serviceType}\n機場/航班：${airport} / ${flightNumber}\n接送地址：${district} ${address}\n車型：${carType}\n預估總額：${estimatedTotal ? '$' + estimatedTotal : '待報價'} (${payment})\n${finalRemarks ? '備註：\n' + finalRemarks : ''}`
            }]);
            window.liff.closeWindow();
          } else {
            showAlert(`預約已提交成功！\n您的預約編號為：${reservationId}`, '提交成功', 'info');
          }
        } catch (err) { showAlert('資料寫入失敗，請檢查網路連線', '錯誤', 'error'); } finally { setIsSubmitting(false); }
      };

      const filteredDistricts = useMemo(() => {
        const dynamicDists = Object.keys(priceMap).filter(key => key.startsWith(airport + '_')).map(key => key.split('_')[1]);
        const options = dynamicDists.length > 0 ? dynamicDists : Object.values(DISTRICTS_FALLBACK).flat();
        if (!district) return options.slice(0, 15);
        return options.filter(d => d.includes(district)).slice(0, 20);
      }, [priceMap, airport, district]);

      const renderNumberOptions = (max) => Array.from({ length: max + 1 }, (_, i) => <option key={i} value={i}>{i}</option>);

      return (
        <div className="pb-10">
          <CustomModal isOpen={modal.open} title={modal.title} message={modal.message} type={modal.type} onClose={() => setModal({...modal, open: false})} />

          <header className="bg-black text-white p-4 sticky top-0 z-50 shadow-md flex justify-center items-center relative">
            <h1 className="text-xl font-bold tracking-wider">RS專車接送 詢價/預約</h1>
            <div className="flex gap-4 absolute right-4">
              <button onClick={fetchPrices} type="button"><RefreshCw className={`w-5 h-5 ${isLoadingPrices ? 'animate-spin' : ''}`} /></button>
            </div>
          </header>

          <main className="max-w-md mx-auto mt-6 bg-white shadow-lg p-6 sm:p-8 sm:border border-gray-200">
            <form onSubmit={handleSubmit} className="space-y-6">
              <div className="bg-gray-100 p-3 flex justify-between items-center border border-gray-300">
                <span className="text-sm font-bold flex items-center gap-2 text-gray-600"><FileText className="w-4 h-4" /> 預約編號</span>
                <span className="font-mono text-sm font-bold">{reservationId}</span>
              </div>

              <section className="space-y-4">
                <h2 className="text-lg font-bold border-b-2 border-black pb-2 flex items-center gap-2"><User className="w-5 h-5" /> 乘車人資訊</h2>
                <div className="flex gap-2">
                  <input type="text" required className="flex-1 p-3 border border-gray-300 outline-none focus:border-black text-base" placeholder="真實姓名" value={name} onChange={e => setName(e.target.value)} />
                  <select className="p-3 border border-gray-300 bg-white text-base" value={title} onChange={e => setTitle(e.target.value)}><option>先生</option><option>小姐</option></select>
                </div>
                <input type="tel" required className="w-full p-3 border border-gray-300 font-mono outline-none focus:border-black text-base" value={phone} onChange={handlePhoneChange} placeholder="0900-000-000" />

                <div className="pt-2 border-t border-gray-100 mt-2 relative">
                  <label className="block text-base font-bold text-gray-700 mb-1 flex items-center gap-1"><MapPin className="w-4 h-4" /> 接送地址</label>
                  <div className="relative mb-2">
                    <input type="text" required className="w-full p-3 border border-gray-300 bg-white outline-none focus:border-black text-base" value={district} onFocus={() => setShowDistrictList(true)} onChange={e => {setDistrict(e.target.value); setShowDistrictList(true);}} placeholder="輸入郵遞區號或區域搜尋" />
                    {showDistrictList && (
                      <div className="absolute z-[100] w-full bg-white border border-gray-300 shadow-2xl mt-1 max-h-60 overflow-y-auto">
                        {filteredDistricts.map((d, idx) => (
                          <div key={idx} className="p-3 border-b border-gray-50 active:bg-black active:text-white" onMouseDown={() => {setDistrict(d); setShowDistrictList(false);}}>{d}</div>
                        ))}
                      </div>
                    )}
                  </div>
                  <input ref={addressInputRef} type="text" required className="w-full p-3 border border-gray-300 outline-none focus:border-black text-base" value={address} onChange={e => setAddress(e.target.value)} placeholder={mapsError ? "請手動輸入詳細地址" : "輸入詳細地址 (支援自動完成)"} />
                </div>
              </section>

              <section className="space-y-4">
                <h2 className="text-lg font-bold border-b-2 border-black pb-2 flex items-center gap-2 mt-8"><Calendar className="w-5 h-5" /> 乘車資訊</h2>
                <label className="block text-base font-bold text-gray-700">乘車日期 <span className="text-red-500 font-bold text-xs">(小於24H請直接來電)</span></label>
                <input type="date" required className="w-full p-3 border border-gray-300 outline-none focus:border-black text-base" value={date} onChange={e => setDate(e.target.value)} />
                <div className="flex gap-2">
                  <select className="flex-1 p-3 border border-gray-300 bg-white text-base" value={timeHour} onChange={e => setTimeHour(e.target.value)}>{Array.from({length:24},(_,i)=>i.toString().padStart(2,'0')).map(h=><option key={h} value={h}>{h}</option>)}</select>
                  <select className="flex-1 p-3 border border-gray-300 bg-white text-base" value={timeMinute} onChange={e => setTimeMinute(e.target.value)}>{Array.from({length:12},(_,i)=>(i*5).toString().padStart(2,'0')).map(m=><option key={m} value={m}>{m}</option>)}</select>
                </div>
                <div className="grid grid-cols-2 gap-4">
                  <select className="p-3 border border-gray-300 bg-white font-bold text-base" value={serviceType} onChange={e => setServiceType(e.target.value)}><option value="送機">送機</option><option value="接機">接機 (+ $200)</option></select>
                  <select className="p-3 border border-gray-300 bg-white font-bold text-base" value={airport} onChange={e => setAirport(e.target.value)}><option>桃園機場</option><option>松山機場</option><option>台中機場</option></select>
                </div>
                <input type="text" required className="w-full p-3 border border-gray-300 font-mono uppercase text-base" value={flightNumber} onChange={handleFlightChange} placeholder="航班編號 EX: BR123" />
              </section>

              <section className="space-y-4">
                <h2 className="text-lg font-bold border-b-2 border-black pb-2 flex items-center gap-2 mt-8"><Car className="w-5 h-5" /> 車型與人數行李 <span className="text-red-500 font-bold text-xs">(最多6人6件)</span></h2>
                <select className="w-full p-3 border border-gray-300 bg-white font-bold text-base" value={carType} onChange={e => setCarType(e.target.value)} disabled={(Number(carryOn)+Number(checkedBag))>=3 || (Number(adults)+Number(children)+Number(infants))>=5}>
                  <option value="小車">小車</option><option value="大車">大車</option>
                </select>
                <div className="grid grid-cols-3 gap-2 text-center text-sm font-bold text-gray-700">
                  <div>大人<select className="w-full p-3 border" value={adults} onChange={e=>setAdults(Number(e.target.value))}>{renderNumberOptions(6)}</select></div>
                  <div>4~12歲<select className="w-full p-3 border" value={children} onChange={e=>setChildren(Number(e.target.value))}>{renderNumberOptions(5)}</select></div>
                  <div>4歲以下<select className="w-full p-3 border" value={infants} onChange={e=>setInfants(Number(e.target.value))}>{renderNumberOptions(5)}</select></div>
                </div>
                <div className="grid grid-cols-2 gap-2 text-center text-sm font-bold text-gray-700">
                  <div>登機箱<select className="w-full p-3 border" value={carryOn} onChange={e=>setCarryOn(Number(e.target.value))}>{renderNumberOptions(6)}</select></div>
                  <div>託運 <span className="text-red-500 text-xs">(21~29吋)</span><select className="w-full p-3 border" value={checkedBag} onChange={e=>setCheckedBag(Number(e.target.value))}>{renderNumberOptions(6)}</select></div>
                </div>
              </section>

              <section className="space-y-4">
                <h2 className="text-lg font-bold border-b-2 border-black pb-2 flex items-center gap-2 mt-8"><CreditCard className="w-5 h-5" /> 費用與付款</h2>
                <div className="p-3 bg-gray-50 border border-gray-200">
                  <label className="flex items-center gap-2 cursor-pointer py-1 font-bold">
                    <input type="checkbox" className="w-5 h-5 accent-black" checked={extraSignboard} onChange={e=>setExtraSignboard(e.target.checked)} />舉牌服務 (+$200)
                  </label>
                  {extraSignboard && <input type="text" className="w-full mt-2 p-3 border text-base" placeholder="輸入舉牌內容" value={signboardText} onChange={e => setSignboardText(e.target.value)} />}
                </div>
                <div className="bg-black text-white p-5 border-t-4 border-yellow-400">
                  <div className="flex justify-between text-sm font-mono"><span>{airport} - {district || '未選區'}</span><span className="text-yellow-400 font-bold">{basePrice > 0 ? `$${basePrice}` : '待報價'}</span></div>
                  <div className="mt-4 pt-3 border-t border-gray-700 flex justify-between items-end">
                    <span className="font-bold text-xs uppercase">Total</span>
                    <span className="text-3xl font-black">{estimatedTotal ? `$${estimatedTotal}` : '待報價'}</span>
                  </div>
                </div>
              </section>

              <section className="mt-8 border-t-2 border-black pt-6">
                <div className="bg-gray-100 p-4 border border-gray-300 h-80 overflow-y-auto text-xs text-gray-700 mb-4 leading-relaxed justify-text">
                  <h3 className="font-bold text-black mb-3 flex items-center gap-1 text-sm"><ShieldAlert className="w-4 h-4" /> 【注意事項】</h3>
                  <div className="space-y-4">
                    <p>1、如預約時無加點行程、當天服務司機無法多停上下車點(車輛均有 GPS )請體諒司機無法私自增加停靠點若臨時多加上下車點，可以告知司機請司機回報公司後方可執行「時加點服務」。</p>
                    <p>2、依實際人數及行李件數尺寸預約車款。</p>
                    <p>3、為了行車安全及法規，乘車時請繫上安全帶，車內座位區、腳踏墊區不得放置行李(隨身行李背包除外)。預約時請評估行李箱大小決定車種，司機現場服務時遇實際件數與預約資料不符時，本公司有權利終止租用車輛拒絕服務且該趟行程將視同已使用。</p>
                    <p>4、為維護乘車品質，顧及每位貴賓權益，車內勿飲食。</p>
                    <p>5、因應政府「小型車附載幼童安全乘坐實施及宣導辦法」規範：2 歲以下兒童乘坐小客車，需繫安全帶或使用安全座椅(增高墊)乘坐。嬰幼兒若在 0~4 歲且體重 18 公斤內，強制使用安全座椅。(此項目受法令規範，如未依實際需求數量加購與安裝安全椅/增高墊：所有一切責任(罰款)將由乘車人承擔。)</p>
                  </div>
                </div>
                <label className="flex items-start gap-3 cursor-pointer p-4 border border-black font-black text-sm bg-white active:bg-gray-50">
                  <input type="checkbox" required className="w-6 h-6 mt-0.5 accent-black" checked={agreed} onChange={e=>setAgreed(e.target.checked)} />我同意以上資訊與免責聲明。
                </label>
              </section>

              <button type="submit" disabled={!agreed || isSubmitting} className={`w-full py-5 text-xl font-black flex items-center justify-center gap-3 transition-all ${agreed && !isSubmitting ? 'bg-black text-white shadow-2xl' : 'bg-gray-300 text-gray-500'}`}>
                {isSubmitting ? '預約傳送中...' : '確認預約並送出'}
              </button>
            </form>

            <div className="mt-10 text-center border-t-4 border-black pt-8 pb-4">
              <p className="text-xl font-black mb-2">24H 預約服務電話</p>
              <a href="tel:0915926166" className="text-4xl sm:text-5xl font-black text-black hover:underline tracking-wider block" style={{ WebkitTextStroke: '1.5px black' }}>0915-926-166</a>
            </div>
          </main>
        </div>
      );
    }

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);
  </script>
</body>
