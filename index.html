<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>RS專車接送 詢價/預約</title>
  
  <script src="https://cdn.tailwindcss.com"></script>
  <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
  <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  
  <script>
    window.require = function(name) {
      if (name === 'react') return window.React;
      if (name === 'react-dom') return window.ReactDOM;
      return null;
    };
    window.module = { exports: {} };
    window.exports = window.module.exports;
    window.define = undefined;
  </script>

  <script src="https://unpkg.com/lucide-react@0.344.0/dist/umd/lucide-react.js"></script>

  <script>
    if (!window.lucideReact && window.module && window.module.exports && window.module.exports.Calendar) {
      window.lucideReact = window.module.exports;
    }
  </script>

  <script charset="utf-8" src="https://static.line-scdn.net/liff/edge/2/sdk.js"></script>
  <style>
    .justify-text {
      text-align: justify;
      text-justify: inter-ideograph;
    }
    .font-black-stroke {
      -webkit-text-stroke: 1.5px black;
    }
    @keyframes pulse-red {
      0%, 100% { opacity: 1; }
      50% { opacity: 0.7; }
    }
    .animate-pulse-red {
      animation: pulse-red 2s cubic-bezier(0.4, 0, 0.6, 1) infinite;
    }
  </style>
</head>
<body class="bg-gray-50 text-black font-sans">
  
  <div id="root"></div>

  <script type="text/babel">
    const { useState, useEffect, useMemo, useRef } = React;
    
    const FallbackIcon = () => <span></span>;
    const { 
      Calendar = FallbackIcon, Clock = FallbackIcon, MapPin = FallbackIcon, Phone = FallbackIcon, User = FallbackIcon, Plane = FallbackIcon, Car = FallbackIcon, 
      Briefcase = FallbackIcon, Users = FallbackIcon, CreditCard = FallbackIcon, Mail = FallbackIcon, FileText = FallbackIcon, CheckCircle = FallbackIcon, 
      ShieldAlert = FallbackIcon, Receipt = FallbackIcon, Database = FallbackIcon, Send = FallbackIcon, RefreshCw = FallbackIcon, Search = FallbackIcon, X = FallbackIcon, AlertCircle = FallbackIcon, PlusCircle = FallbackIcon, Info = FallbackIcon
    } = window.lucideReact || {};

    const GAS_WEBAPP_URL = 'https://script.google.com/macros/s/AKfycbwbTEF9LBnj2RB7cKgaFujfwCfG15sCMfL7REds-3oTeWQ-FTHU8c_DRPGgsH6LRsAZ_w/exec';
    const GOOGLE_MAPS_API_KEY = 'AIzaSyAxYym5ZR8puPb0iiycHdwzTJTKH0Aears';
    const LINE_LIFF_ID = '2009753964-IEeYinij';

    const DISTRICTS_FALLBACK = {
      "台北市": ["100 中正區", "103 大同區", "104 中山區", "105 松山區", "106 大安區", "108 萬華區", "110 信義區", "111 士林區", "112 北投區", "114 內湖區", "115 南港區", "116 文山區"],
      "新北市": ["207 萬里區", "208 金山區", "220 板橋區", "221 汐止區", "222 深坑區", "223 石碇區", "224 瑞芳區", "226 平溪區", "227 雙溪區", "228 貢寮區", "231 新店區", "232 坪林區", "233 烏來區", "234 永和區", "235 中和區", "236 土城區", "237 三峽區", "238 樹林區", "239 鶯歌區", "241 三重區", "242 新莊區", "243 泰山區", "244 林口區", "247 蘆洲區", "248 五股區", "249 八里區", "251 淡水區", "252 三芝區", "253 石門區"],
      "桃園市": ["320 中壢區", "324 平鎮區", "325 龍潭區", "326 楊梅區", "327 新屋區", "328 觀音區", "330 桃園區", "333 龜山區", "334 八德區", "338 蘆竹區", "337 大園區", "335 大溪區", "336 復興區"],
      "新竹市": ["300 東區", "300 北區", "300 香山區"],
      "新竹縣": ["302 竹北市", "303 湖口鄉", "304 新豐鄉", "305 新埔鎮", "306 關西鎮", "307 芎林鄉", "308 寶山鄉", "310 竹東鎮", "311 五峰鄉", "312 橫山鄉", "313 尖石鄉", "314 北埔鄉", "315 峨眉鄉"]
    };

    const generateReservationId = () => {
      const now = new Date();
      const yyyy = now.getFullYear();
      const mm = String(now.getMonth() + 1).padStart(2, '0');
      const dd = String(now.getDate()).padStart(2, '0');
      const dateStr = `${yyyy}${mm}${dd}`;
      const randomDigits = Math.floor(1000 + Math.random() * 9000);
      const chars = 'ABCDEFGHIJKLMNOPQRSTUVWXYZabcdefghijklmnopqrstuvwxyz';
      let randomChars = '';
      for (let i = 0; i < 3; i++) {
        randomChars += chars.charAt(Math.floor(Math.random() * chars.length));
      }
      return `RS${dateStr}${randomDigits}${randomChars}`;
    };

    function CustomModal({ isOpen, onClose, onConfirm, title, message, type = 'info', isSubmitting = false }) {
      if (!isOpen) return null;
      return (
        <div className="fixed inset-0 z-[999] flex items-center justify-center p-4 bg-black/60 backdrop-blur-sm text-center">
          <div className="bg-white w-full max-w-sm rounded-lg shadow-2xl overflow-hidden animate-in zoom-in-95 duration-200 flex flex-col max-h-[85vh]">
            <div className="bg-black p-4 flex justify-between items-center text-white shrink-0">
              <div className="flex items-center gap-2 font-bold tracking-wider uppercase text-sm">
                {type === 'error' ? <AlertCircle className="w-4 h-4 text-red-500" /> : 
                 type === 'confirm' ? <FileText className="w-4 h-4 text-blue-400" /> :
                 <CheckCircle className="w-4 h-4 text-green-500" />}
                {title}
              </div>
              <button onClick={onClose} disabled={isSubmitting}><X className="w-5 h-5 opacity-70 hover:opacity-100" /></button>
            </div>
            <div className="p-6 flex-1 overflow-y-auto text-left">
              <p className="text-gray-700 leading-relaxed font-bold whitespace-pre-wrap text-sm">{message}</p>
            </div>
            <div className="p-4 bg-white border-t border-gray-100 shrink-0 flex gap-2">
              {type === 'confirm' ? (
                <>
                  <button onClick={onClose} disabled={isSubmitting} className="w-1/3 py-3 bg-gray-200 text-gray-700 font-black rounded-sm active:scale-95 transition-transform disabled:opacity-50">返回修改</button>
                  <button onClick={onConfirm} disabled={isSubmitting} className="w-2/3 py-3 bg-black text-white font-black rounded-sm active:scale-95 transition-transform disabled:opacity-50 flex justify-center items-center gap-2">
                    {isSubmitting ? '處理中...' : '確認無誤並送出'}
                  </button>
                </>
              ) : (
                <button onClick={onClose} className="w-full py-3 bg-black text-white font-black rounded-sm active:scale-95 transition-transform">確定</button>
              )}
            </div>
          </div>
        </div>
      );
    }

    function App() {
      const [reservationId] = useState(generateReservationId());
      const [name, setName] = useState('');
      const [title, setTitle] = useState('先生');
      const [phone, setPhone] = useState('');
      const [email, setEmail] = useState('');
      const [date, setDate] = useState('');
      const [timeHour, setTimeHour] = useState('12');
      const [timeMinute, setTimeMinute] = useState('00');
      const [serviceType, setServiceType] = useState('送機');
      const [flightNumber, setFlightNumber] = useState('');
      const [airport, setAirport] = useState('桃園機場');
      const [carType, setCarType] = useState('小車');
      const [carryOn, setCarryOn] = useState(0);
      const [checkedBag, setCheckedBag] = useState(0);
      const [adults, setAdults] = useState(1);
      const [children, setChildren] = useState(0);
      const [infants, setInfants] = useState(0);
      
      const [district, setDistrict] = useState('');
      const [address, setAddress] = useState('');
      
      const [hasExtraPoint, setHasExtraPoint] = useState(false);
      const [extraDistrict, setExtraDistrict] = useState('');
      const [extraAddress, setExtraAddress] = useState('');

      const [payment, setPayment] = useState('現金');
      const [remarks, setRemarks] = useState('');
      const [agreed, setAgreed] = useState(false);
      const [extraSignboard, setExtraSignboard] = useState(false);
      const [signboardText, setSignboardText] = useState('');

      const [priceMap, setPriceMap] = useState({});
      const [isLoadingPrices, setIsLoadingPrices] = useState(false);
      const [isSubmitting, setIsSubmitting] = useState(false);
      const [mapsError, setMapsError] = useState(false);
      
      // 狀態管理：彈跳視窗與暫存確認資料
      const [modal, setModal] = useState({ open: false, title: '', message: '', type: 'info', onConfirm: null });
      const [confirmData, setConfirmData] = useState(null); 
      
      const [showDistrictList, setShowDistrictList] = useState(false);
      const [showExtraDistrictList, setShowExtraDistrictList] = useState(false);

      const addressInputRef = useRef(null);
      const extraAddressInputRef = useRef(null);

      const showAlert = (msg, title = '系統訊息', type = 'info', onConfirm = null) => {
        setModal({ open: true, title, message: msg, type, onConfirm });
      };

      const handleFlightChange = (e) => {
        setFlightNumber(e.target.value.replace(/[^a-zA-Z0-9]/g, '').toUpperCase());
      };

      const carTypeConstraint = useMemo(() => {
        const totalLuggage = Number(carryOn) + Number(checkedBag);
        const totalPeople = Number(adults) + Number(children) + Number(infants);
        if (totalLuggage >= 3 || totalPeople >= 5) {
          const reason = totalLuggage >= 3 ? "行李總計達 3 件以上" : "人數總計達 5 人以上";
          return { isForced: true, reason };
        }
        return { isForced: false, reason: '' };
      }, [carryOn, checkedBag, adults, children, infants]);

      useEffect(() => {
        if (carTypeConstraint.isForced) setCarType('大車');
      }, [carTypeConstraint]);

      useEffect(() => {
        if (date && timeHour && timeMinute) {
          const selectedDate = new Date(`${date}T${timeHour}:${timeMinute}:00`);
          const now = new Date();
          const diffHours = (selectedDate.getTime() - now.getTime()) / (1000 * 60 * 60);
          
          if (diffHours < 24) {
            showAlert('預約時間小於24小時無法線上預約，請直接來電 0915-926-166。', '時間限制', 'error');
            setDate(''); 
          }
        }
      }, [date, timeHour, timeMinute]);

      useEffect(() => {
        if (window.liff) {
          window.liff.init({ liffId: LINE_LIFF_ID }).then(() => console.log('LIFF Ready')).catch(err => console.error(err));
        }
        window.gm_authFailure = () => {
          setMapsError(true);
          showAlert("【地圖功能提示】目前受限於環境安全參照，地址自動完成功能可能暫時無法使用。請手動輸入詳細地址即可正常預約。", "授權提示", "error");
        };
      }, []);

      const findMatchingDistrict = (components, fullAddr = "") => {
        let districtName = "";
        components.forEach(c => {
          if (c.types.includes("sublocality_level_1")) districtName = c.long_name;
        });
        if (!districtName && fullAddr) {
          const districtRegex = /(?:市|縣)([^區鄉鎮市]+[區鄉鎮市])/;
          const match = fullAddr.match(districtRegex);
          if (match) districtName = match[1];
        }
        if (!districtName) return null;
        const dynamicDists = Object.keys(priceMap).filter(key => key.startsWith(airport + '_')).map(key => key.split('_')[1]);
        const allOptions = dynamicDists.length > 0 ? dynamicDists : Object.values(DISTRICTS_FALLBACK).flat();
        const finalMatch = allOptions.find(opt => opt.includes(districtName));
        return finalMatch || null;
      };

      useEffect(() => {
        const initAutocomplete = (ref, addrSetter, distSetter) => {
          if (ref.current && window.google && window.google.maps && window.google.maps.places) {
            const autocomplete = new window.google.maps.places.Autocomplete(ref.current, {
              types: ['geocode', 'establishment'],
              componentRestrictions: { country: 'tw' }
            });
            autocomplete.addListener('place_changed', () => {
              const place = autocomplete.getPlace();
              if (place.formatted_address) {
                const formatted = place.formatted_address.replace(/^台灣\d{3,5}\s*/, '');
                addrSetter(formatted);
                const matched = findMatchingDistrict(place.address_components || [], place.formatted_address);
                if (matched) distSetter(matched);
              }
            });
          }
        };
        if (!window.google) {
          const script = document.createElement('script');
          script.src = `https://maps.googleapis.com/maps/api/js?key=${GOOGLE_MAPS_API_KEY}&libraries=places&language=zh-TW`;
          script.async = true; script.defer = true;
          script.onload = () => {
            initAutocomplete(addressInputRef, setAddress, setDistrict);
            if (hasExtraPoint) initAutocomplete(extraAddressInputRef, setExtraAddress, setExtraDistrict);
          };
          document.head.appendChild(script);
        } else {
          initAutocomplete(addressInputRef, setAddress, setDistrict);
          if (hasExtraPoint) initAutocomplete(extraAddressInputRef, setExtraAddress, setExtraDistrict);
        }
      }, [hasExtraPoint, airport, priceMap]);

      useEffect(() => { fetchPrices(); }, []);

      const fetchPrices = async () => {
        if (GAS_WEBAPP_URL.includes('YOUR_GAS_ID')) return;
        setIsLoadingPrices(true);
        try {
          const response = await fetch(`${GAS_WEBAPP_URL}?action=getPrices`);
          const data = await response.json();
          if (data.status === 'success') setPriceMap(data.prices);
        } catch (err) { console.error(err); } finally { setIsLoadingPrices(false); }
      };

      const handlePhoneChange = (e) => {
        let val = e.target.value.replace(/\D/g, '').slice(0, 10);
        let formatted = val;
        if (val.length > 7) formatted = `${val.slice(0, 4)}-${val.slice(4, 7)}-${val.slice(7)}`;
        else if (val.length > 4) formatted = `${val.slice(0, 4)}-${val.slice(4)}`;
        setPhone(formatted);
      };

      const basePriceInfo = useMemo(() => {
        let mainPrice = 0;
        let extraPrice = 0;

        if (district) {
          const key1 = `${airport}_${district}`;
          const priceData1 = priceMap[key1];
          if (priceData1) mainPrice = carType === '大車' ? priceData1.large : priceData1.small;
        }

        if (hasExtraPoint && extraDistrict) {
          const key2 = `${airport}_${extraDistrict}`;
          const priceData2 = priceMap[key2];
          if (priceData2) extraPrice = carType === '大車' ? priceData2.large : priceData2.small;
        }

        if (hasExtraPoint && extraPrice > mainPrice) {
          return { price: extraPrice, name: extraDistrict };
        }
        
        return { price: mainPrice, name: district };
      }, [priceMap, airport, district, extraDistrict, hasExtraPoint, carType]);

      const extraPointInfo = useMemo(() => {
        if (!hasExtraPoint || !district || !extraDistrict) return { fee: 0, label: '' };
        const isMainXiangshan = district.includes("香山區");
        const isExtraXiangshan = extraDistrict.includes("香山區");
        if (isMainXiangshan && isExtraXiangshan) return { fee: 100, label: '（同區）' };
        if (isMainXiangshan || isExtraXiangshan) return { fee: 200, label: '（跨區）' };
        const zip1 = district.substring(0, 3);
        const zip2 = extraDistrict.substring(0, 3);
        return (zip1 && zip2 && zip1 === zip2) ? { fee: 100, label: '（同區）' } : { fee: 200, label: '（跨區）' };
      }, [hasExtraPoint, district, extraDistrict]);

      const fees = useMemo(() => {
        const pickupFee = serviceType === '接機' ? 200 : 0;
        const hour = parseInt(timeHour);
        const nightFee = (hour >= 22 || hour < 6) ? 200 : 0;
        const infantSeatFee = infants * 200;
        const signboardFee = extraSignboard ? 200 : 0;
        const extraPointFee = extraPointInfo.fee;
        return { pickupFee, nightFee, infantSeatFee, signboardFee, extraPointFee };
      }, [serviceType, timeHour, infants, extraSignboard, extraPointInfo]);

      const estimatedTotal = useMemo(() => {
        const sumExtra = Object.values(fees).reduce((a, b) => a + b, 0);
        return basePriceInfo.price > 0 ? basePriceInfo.price + sumExtra : null;
      }, [basePriceInfo.price, fees]);

      // 獨立的發送流程函式 (在確認視窗關閉後執行)
      const executeSubmit = async (payload, lineText) => {
        if (isSubmitting) return;
        setIsSubmitting(true);
        
        try {
          await fetch(GAS_WEBAPP_URL, { method: 'POST', mode: 'no-cors', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(payload) });
          
          if (window.liff && window.liff.isInClient()) {
            try {
              await window.liff.sendMessages([{ type: 'text', text: lineText }]);
              showAlert(`🌟 預約已成功送出！\n明細已同步回傳至 LINE 聊天室。\n\n(點擊下方確定後將自動關閉本視窗)`, '預約成功', 'success', () => {
                window.liff.closeWindow();
              });
            } catch (err) {
              console.error('LINE 傳送失敗:', err);
              showAlert(`🌟 預約已成功送出！\n\n(但 LINE 系統回傳失敗，請自行截圖保存或確認聯絡資訊)\n\n(點擊下方確定後將自動關閉本視窗)`, '提交成功', 'info', () => {
                window.liff.closeWindow();
              });
            }
          } else {
            showAlert(`🌟 預約已成功送出！\n\n(系統偵測您目前不在 LINE 內開啟，本畫面可直接截圖保存)\n\n⬇️ 以下為您的預約明細 ⬇️\n\n${lineText}`, '預約成功', 'success');
          }
        } catch (err) { 
          showAlert('資料寫入失敗，請檢查網路連線', '錯誤', 'error'); 
        } finally { 
          setIsSubmitting(false); 
          setConfirmData(null); // 清空暫存
        }
      };

      const handleSubmit = async (e) => {
        e.preventDefault();
        
        const missingFields = [];
        
        // 攔截檢查機制
        if (!name.trim()) missingFields.push('乘車人真實姓名');
        
        if (!phone.trim()) {
          missingFields.push('聯絡電話');
        } else {
          const phoneDigits = phone.replace(/\D/g, '');
          if (phoneDigits.length !== 10 || !phoneDigits.startsWith('09')) {
            missingFields.push('聯絡電話 (需為09開頭之10碼)');
          }
        }
        
        if (!email.trim()) {
          missingFields.push('MAIL 電子信箱');
        } else {
          // 信箱格式驗證
          const emailRegex = /^[^\s@]+@[^\s@]+\.[^\s@]+$/;
          if (!emailRegex.test(email.trim())) {
            missingFields.push('MAIL 電子信箱 (格式不正確)');
          }
        }
        
        if (!district.trim()) missingFields.push('接送地址 - 區域與郵遞區號');
        if (!address.trim()) missingFields.push('接送地址 - 詳細地址');
        
        if (hasExtraPoint) {
          if (!extraDistrict.trim()) missingFields.push('加點服務 - 加點區域');
          if (!extraAddress.trim()) missingFields.push('加點服務 - 加點詳細地址');
        }
        
        if (!date) missingFields.push('乘車資訊 - 乘車日期');
        if (!flightNumber.trim()) missingFields.push('乘車資訊 - 航班編號');
        if (extraSignboard && !signboardText.trim()) missingFields.push('舉牌服務 - 舉牌內容');
        if (!agreed) missingFields.push('【注意事項與免責聲明】需勾選同意');

        // 如果有缺少欄位或格式不正確，跳出提示並阻擋後續流程 (不會進入確認視窗)
        if (missingFields.length > 0) {
          const formattedMissing = missingFields.map(f => `• ${f}`).join('\n');
          showAlert(`您還有欄位尚未填寫完整或格式有誤：\n\n${formattedMissing}`, '資料未填寫完整', 'error');
          return;
        }

        const finalRemarks = extraSignboard && signboardText ? `【舉牌內容：${signboardText}】\n${remarks}` : remarks;
        
        const lineText = `【RS專車接送 線上預約單】
預約編號：${reservationId}
乘車人姓名：${name} ${title}
乘車人電話：${phone}
電子信箱：${email}
乘車日期：${date}
乘車時間：${timeHour}:${timeMinute}
服務類型：${serviceType}
接送機場：${airport}
航班編號：${flightNumber}
接送地址：${district} ${address}
${hasExtraPoint ? `加點地址：${extraDistrict} ${extraAddress}\n加點費用：$${extraPointInfo.fee}${extraPointInfo.label}\n` : ``}車型：${carType}
乘車人數：大人${adults}, 小孩${children}, 幼童${infants}
行李件數：登機箱${carryOn}, 託運${checkedBag}
預估總額：${estimatedTotal ? '$' + estimatedTotal : '待系統報價'} (${payment})
${finalRemarks ? `備註：\n${finalRemarks}` : ``}`;

        const payload = {
          action: 'addReservation',
          data: {
            reservationId, 
            name: `${name} ${title}`, 
            phone, 
            email, 
            date: date, 
            time: `'${timeHour}:${timeMinute}`,
            serviceType, 
            airport, 
            flightNumber, 
            district: district, 
            address: address, 
            extraLocation: hasExtraPoint ? `${extraDistrict} ${extraAddress}` : '無',
            carType, 
            passengers: `成人:${adults}, 小孩:${children}, 幼童:${infants}`, 
            luggage: `登機箱:${carryOn}, 託運:${checkedBag}`,
            payment, 
            totalFee: estimatedTotal || '待系統報價', 
            remarks: finalRemarks, 
            timestamp: new Date().toLocaleString('zh-TW')
          }
        };

        // 儲存至 ConfirmData 並打開確認視窗
        setConfirmData({ payload, lineText });
        setModal({
          open: true,
          title: '請確認預約明細',
          message: lineText,
          type: 'confirm',
          onConfirm: null 
        });
      };

      const getFilteredDistricts = (query) => {
        const dynamicDists = Object.keys(priceMap).filter(key => key.startsWith(airport + '_')).map(key => key.split('_')[1]);
        const options = dynamicDists.length > 0 ? dynamicDists : Object.values(DISTRICTS_FALLBACK).flat();
        if (!query) return options.slice(0, 15);
        return options.filter(d => d.includes(query)).slice(0, 20);
      };

      const renderOptionsWithLimit = (otherSum, maxTotal) => {
        const remaining = maxTotal - otherSum;
        const options = [];
        for (let i = 0; i <= remaining; i++) options.push(<option key={i} value={i}>{i}</option>);
        return options;
      };

      return (
        <div className="pb-10">
          <CustomModal 
            isOpen={modal.open} 
            title={modal.title} 
            message={modal.message} 
            type={modal.type} 
            isSubmitting={isSubmitting}
            onClose={() => {
              const prevOnConfirm = modal.onConfirm;
              setModal({ open: false, title: '', message: '', type: 'info', onConfirm: null });
              
              // 若不是確認視窗且有綁定行為 (例如: 傳送成功後關閉視窗)
              if (modal.type !== 'confirm' && typeof prevOnConfirm === 'function') {
                try { prevOnConfirm(); } catch(e) { console.error(e); }
              }
            }} 
            onConfirm={() => {
              // 使用者點選確認後
              if (modal.type === 'confirm') {
                // 1. 先關閉確認彈跳視窗
                setModal({ open: false, title: '', message: '', type: 'info', onConfirm: null });
                
                // 2. 視窗關閉後，才開始呼叫發送與回傳 LINE 邏輯
                if (confirmData) {
                  executeSubmit(confirmData.payload, confirmData.lineText);
                }
              }
            }}
          />
          
          <header className="bg-black text-white p-4 sticky top-0 z-50 shadow-md flex justify-center items-center relative text-center">
            <h1 className="text-xl font-bold tracking-wider">RS專車接送 詢價/預約</h1>
            <div className="flex gap-4 absolute right-4">
              <button onClick={fetchPrices} type="button"><RefreshCw className={`w-5 h-5 ${isLoadingPrices ? 'animate-spin' : ''}`} /></button>
            </div>
          </header>

          <main className="max-w-md mx-auto mt-6 bg-white shadow-lg p-6 sm:p-8 sm:border border-gray-200">
            <form onSubmit={handleSubmit} className="space-y-6" noValidate>
              <div className="bg-gray-100 p-3 flex justify-between items-center border border-gray-300">
                <span className="text-sm font-bold flex items-center gap-2 text-gray-600"><FileText className="w-4 h-4" /> 預約編號</span>
                <span className="font-mono text-sm font-bold">{reservationId}</span>
              </div>

              <section className="space-y-4">
                <h2 className="text-lg font-bold border-b-2 border-black pb-2 flex items-center gap-2"><User className="w-5 h-5" /> 乘車人資訊</h2>
                <div className="flex gap-2">
                  <input type="text" className="flex-1 p-3 border border-gray-300 outline-none focus:border-black text-base" placeholder="真實姓名" value={name} onChange={e => setName(e.target.value)} />
                  <select className="p-3 border border-gray-300 bg-white text-base" value={title} onChange={e => setTitle(e.target.value)}><option>先生</option><option>小姐</option></select>
                </div>
                <input type="tel" className="w-full p-3 border border-gray-300 font-mono outline-none focus:border-black text-base" value={phone} onChange={handlePhoneChange} placeholder="聯絡電話 0900-000-000" />
                <input type="email" className="w-full p-3 border border-gray-300 outline-none focus:border-black text-base" value={email} onChange={e => setEmail(e.target.value)} placeholder="MAIL 電子信箱" />

                <div className="pt-2 border-t border-gray-100 mt-2 relative">
                  <label className="block text-base font-bold text-gray-700 mb-1 flex items-center gap-1"><MapPin className="w-4 h-4" /> 接送地址</label>
                  <div className="relative mb-2">
                    <input type="text" className="w-full p-3 border border-gray-300 bg-white outline-none focus:border-black text-base" value={district} onFocus={() => setShowDistrictList(true)} onChange={e => {setDistrict(e.target.value); setShowDistrictList(true);}} placeholder="區域與郵遞區號 (自動對應)" />
                    {showDistrictList && (
                      <div className="absolute z-[100] w-full bg-white border border-gray-300 shadow-2xl mt-1 max-h-60 overflow-y-auto">
                        {getFilteredDistricts(district).map((d, idx) => (
                          <div key={idx} className="p-3 border-b border-gray-50 active:bg-black active:text-white" onMouseDown={() => {setDistrict(d); setShowDistrictList(false);}}>{d}</div>
                        ))}
                      </div>
                    )}
                  </div>
                  <input ref={addressInputRef} type="text" className="w-full p-3 border border-gray-300 outline-none focus:border-black text-base mb-4 font-bold bg-yellow-50" value={address} onChange={e => setAddress(e.target.value)} placeholder={mapsError ? "請手動輸入詳細地址" : "輸入詳細地址 (自動解析)"} />

                  <div className="mt-2 p-3 bg-gray-50 border border-dashed border-gray-400 rounded-sm">
                    <label className="flex items-center gap-2 cursor-pointer font-black text-sm">
                      <input type="checkbox" className="w-5 h-5 accent-black" checked={hasExtraPoint} onChange={e => setHasExtraPoint(e.target.checked)} />
                      <PlusCircle className="w-4 h-4 text-green-600" /> 需加點服務 (每點 +$100起)
                    </label>
                    <p className="text-[11px] text-red-600 font-bold ml-7 mt-1 animate-pulse-red">※ 加點上下車順序需由本公司安排。</p>
                    
                    {hasExtraPoint && (
                      <div className="mt-4 space-y-2 animate-in slide-in-from-top-2 duration-200">
                        <div className="relative">
                          <input type="text" className="w-full p-3 border border-gray-300 bg-white outline-none focus:border-black text-base" value={extraDistrict} onFocus={() => setShowExtraDistrictList(true)} onChange={e => {setExtraDistrict(e.target.value); setShowExtraDistrictList(true);}} placeholder="加點區域 (自動對應)" />
                          {showExtraDistrictList && (
                            <div className="absolute z-[100] w-full bg-white border border-gray-300 shadow-2xl mt-1 max-h-40 overflow-y-auto">
                              {getFilteredDistricts(extraDistrict).map((d, idx) => (
                                <div key={idx} className="p-3 border-b border-gray-50 active:bg-black active:text-white" onMouseDown={() => {setExtraDistrict(d); setShowExtraDistrictList(false);}}>{d}</div>
                              ))}
                            </div>
                          )}
                        </div>
                        <input ref={extraAddressInputRef} type="text" className="w-full p-3 border border-gray-300 outline-none focus:border-black text-base bg-yellow-50 font-bold" value={extraAddress} onChange={e => setExtraAddress(e.target.value)} placeholder="加點：詳細地址" />
                        <div className="bg-blue-50 p-2 rounded-sm flex items-start gap-2 mt-2">
                           <Info className="w-4 h-4 text-blue-500 mt-0.5 flex-shrink-0" />
                           <p className="text-[10px] text-blue-700 leading-tight text-justify justify-text text-sm">系統預計最多2個接送點，超過2個接送點請直接聯絡客服，謝謝。</p>
                        </div>
                      </div>
                    )}
                  </div>
                </div>
              </section>

              <section className="space-y-4">
                <h2 className="text-lg font-bold border-b-2 border-black pb-2 flex items-center gap-2 mt-8"><Calendar className="w-5 h-5" /> 乘車資訊</h2>
                <label className="block text-base font-bold text-gray-700">乘車日期 <span className="text-red-500 font-bold text-xs">(小於24H請直接來電)</span></label>
                <input type="date" className="w-full p-3 border border-gray-300 outline-none focus:border-black text-base" value={date} onChange={e => setDate(e.target.value)} />
                <div className="flex gap-2">
                  <select className="flex-1 p-3 border border-gray-300 bg-white text-base" value={timeHour} onChange={e => setTimeHour(e.target.value)}>{Array.from({length:24},(_,i)=>i.toString().padStart(2,'0')).map(h=><option key={h} value={h}>{h}</option>)}</select>
                  <select className="flex-1 p-3 border border-gray-300 bg-white text-base" value={timeMinute} onChange={e => setTimeMinute(e.target.value)}>{Array.from({length:12},(_,i)=>(i*5).toString().padStart(2,'0')).map(m=><option key={m} value={m}>{m}</option>)}</select>
                </div>
                <div className="grid grid-cols-2 gap-4">
                  <select className="p-3 border border-gray-300 bg-white font-bold text-base" value={serviceType} onChange={e => setServiceType(e.target.value)}><option value="送機">送機</option><option value="接機">接機 (+ $200)</option></select>
                  <select className="p-3 border border-gray-300 bg-white font-bold text-base" value={airport} onChange={e => setAirport(e.target.value)}><option>桃園機場</option><option>松山機場</option><option>台中機場</option></select>
                </div>
                <input type="text" className="w-full p-3 border border-gray-300 font-mono uppercase text-base" value={flightNumber} onChange={handleFlightChange} placeholder="航班編號 EX: BR123" />
              </section>

              <section className="space-y-4">
                <h2 className="text-lg font-bold border-b-2 border-black pb-2 flex items-center gap-2 mt-8">
                  <Car className="w-5 h-5" /> 車型與人數行李 <span className="text-red-500 font-bold text-xs">(最多6人6件 **包含登機箱** )</span>
                </h2>
                <div className="relative">
                  <select className={`w-full p-3 border font-bold text-base outline-none focus:border-black ${carTypeConstraint.isForced ? 'bg-gray-100 border-red-300 text-red-700 cursor-not-allowed' : 'bg-white border-gray-300'}`} value={carType} onChange={e => !carTypeConstraint.isForced && setCarType(e.target.value)} disabled={carTypeConstraint.isForced}>
                    <option value="小車">小車</option><option value="大車">大車</option>
                  </select>
                  {carTypeConstraint.isForced && (
                    <div className="mt-2 flex items-center gap-1 text-red-600 font-bold text-[11px] bg-red-50 p-2 rounded-sm border border-red-100">
                      <AlertCircle className="w-3.5 h-3.5" /> 因 {carTypeConstraint.reason}，已由系統強制切換為大車服務。
                    </div>
                  )}
                </div>
                <div className="grid grid-cols-3 gap-2 text-center text-sm font-bold text-gray-700">
                  <div>大人<select className="w-full p-3 border text-base" value={adults} onChange={e=>setAdults(Number(e.target.value))}>{renderOptionsWithLimit(children + infants, 6).filter(opt => opt.key > 0)}</select></div>
                  <div>4~12歲<select className="w-full p-3 border text-base" value={children} onChange={e=>setChildren(Number(e.target.value))}>{renderOptionsWithLimit(adults + infants, 6)}</select></div>
                  <div>4歲以下<select className="w-full p-3 border text-base" value={infants} onChange={e=>setInfants(Number(e.target.value))}>{renderOptionsWithLimit(adults + children, 6)}</select></div>
                </div>
                <div className="grid grid-cols-2 gap-2 text-center text-sm font-bold text-gray-700">
                  <div>登機箱<select className="w-full p-3 border text-base" value={carryOn} onChange={e=>setCarryOn(Number(e.target.value))}>{renderOptionsWithLimit(checkedBag, 6)}</select></div>
                  <div>託運 <span className="text-red-500 text-xs">(21~29吋)</span><select className="w-full p-3 border text-base" value={checkedBag} onChange={e=>setCheckedBag(Number(e.target.value))}>{renderOptionsWithLimit(carryOn, 6)}</select></div>
                </div>
              </section>

              <section className="space-y-4">
                <h2 className="text-lg font-bold border-b-2 border-black pb-2 flex items-center gap-2 mt-8"><CreditCard className="w-5 h-5" /> 費用報價</h2>
                <div className="p-3 bg-gray-50 border border-gray-200 rounded-sm">
                  <label className="block text-xs font-bold text-gray-700 mb-2">付款方式</label>
                  <select className="w-full p-3 border border-gray-300 bg-white font-bold text-base outline-none focus:border-black" value={payment} onChange={e => setPayment(e.target.value)}>
                    <option value="現金">現金</option><option value="轉帳">轉帳</option><option value="簽單月結">簽單月結 (限簽約客戶)</option>
                  </select>
                </div>
                <div className="p-3 bg-gray-50 border border-gray-200">
                  <label className="flex items-center gap-2 cursor-pointer py-1 font-bold">
                    <input type="checkbox" className="w-5 h-5 accent-black" checked={extraSignboard} onChange={e=>setExtraSignboard(e.target.checked)} />舉牌服務 (+$200)
                  </label>
                  {extraSignboard && <input type="text" className="w-full mt-2 p-3 border text-base" placeholder="請輸入舉牌內容 (必填)" value={signboardText} onChange={e => setSignboardText(e.target.value)} />}
                </div>

                <div className="bg-black text-white p-6 border-t-8 border-yellow-400 rounded-sm relative shadow-xl text-justify">
                  <h3 className="text-xs font-black tracking-widest text-gray-400 border-b border-gray-800 pb-2 mb-4 flex items-center gap-2 uppercase"><FileText className="w-3 h-3" /> 報價明細內容</h3>
                  <div className="space-y-3 font-mono text-sm">
                    <div className="flex justify-between items-start">
                      <div className="flex flex-col">
                        <span className="text-gray-300 font-bold">基本車資 ({carType})</span>
                        <span className="text-[10px] text-gray-500">
                          {serviceType === '送機' ? `${basePriceInfo.name || '未選區'} - ${airport}` : `${airport} - ${basePriceInfo.name || '未選區'}`}
                        </span>
                      </div>
                      <span className="font-bold">{basePriceInfo.price > 0 ? `$${basePriceInfo.price}` : '待系統報價'}</span>
                    </div>
                    <div className="border-t border-dashed border-gray-800 pt-3 space-y-2">
                      {fees.pickupFee > 0 && <div className="flex justify-between text-gray-400"><span>└ 接機服務費</span><span>+$200</span></div>}
                      {fees.nightFee > 0 && <div className="flex justify-between text-gray-400"><span>└ 夜間加成 (22-06)</span><span>+$200</span></div>}
                      {fees.infantSeatFee > 0 && <div className="flex justify-between text-gray-400"><span>└ 安全座椅 x {infants}</span><span>+${fees.infantSeatFee}</span></div>}
                      {fees.signboardFee > 0 && <div className="flex justify-between text-gray-400"><span>└ 機場舉牌服務</span><span>+$200</span></div>}
                      {fees.extraPointFee > 0 && (
                        <div className="flex justify-between text-gray-400">
                          <span>└ 加點服務 {extraPointInfo.label}</span><span>+${fees.extraPointFee}</span>
                        </div>
                      )}
                    </div>
                    <div className="mt-6 pt-4 border-t-2 border-gray-700 flex justify-between items-center">
                      <span className="font-black text-yellow-400 text-base">預估總額</span>
                      <div className="text-right">
                        <span className="text-3xl font-black">{estimatedTotal ? `$${estimatedTotal}` : '待系統報價'}</span>
                        <div className="text-[10px] text-gray-500 mt-1 uppercase tracking-tighter">付款方式：{payment}</div>
                      </div>
                    </div>
                  </div>
                </div>
              </section>

              <section className="mt-8 border-t-2 border-black pt-6">
                <div className="bg-gray-100 p-4 border border-gray-300 h-80 overflow-y-auto text-xs text-gray-700 mb-4 leading-relaxed justify-text">
                  <h3 className="font-bold text-black mb-3 flex items-center gap-1 text-sm"><ShieldAlert className="w-4 h-4" /> 【注意事項】</h3>
                  <div className="space-y-4 text-sm font-bold text-gray-800">
                    <p>1、如預約時無加點行程、當天服務司機無法多停上下車點(車輛均有 GPS )請體諒司機無法私自增加停靠點若臨時多加上下車點，可以告知司機請司機回報公司後方可執行「時加點服務」。</p>
                    <p>2、依實際人數及行李件數尺寸預約車款。</p>
                    <p>3、為了行車安全及法規，乘車時請繫上安全帶，車內座位區、腳踏墊區不得放置行李(隨身行李背包除外)。預約時請評估行李箱大小決定車種，司機現場服務時遇實際件數與預約資料不符時，本公司有權利終止租用車輛拒絕服務且該趟行程將視同已使用。</p>
                    <p>4、為維護乘車品質，顧及每位貴賓權益，車內勿飲食。</p>
                    <p>5、因應政府「小型車附載幼童安全乘坐實施及宣導辦法」規範：2 歲以下兒童乘坐小客車，需繫安全帶或使用安全座椅(增高墊)乘坐。嬰幼兒若在 0~4 歲且體重 18 公斤內，強制使用安全座椅。(此項目受法令規範，如未依實際需求數量加購與安裝安全椅/增高墊：所有一切責任(罰款)將由乘車人承擔。)</p>
                  </div>
                </div>
                <label className="flex items-start gap-3 cursor-pointer p-4 border border-black font-black text-sm bg-white active:bg-gray-50 transition-colors">
                  <input type="checkbox" required className="w-6 h-6 mt-0.5 accent-black" checked={agreed} onChange={e=>setAgreed(e.target.checked)} />我同意以上資訊與免責聲明。
                </label>
              </section>
              
              <button 
                type="submit" 
                disabled={isSubmitting} 
                className={`w-full py-5 text-xl font-black flex items-center justify-center gap-3 transition-all ${!isSubmitting ? 'bg-black text-white shadow-2xl hover:bg-gray-800 active:scale-95' : 'bg-gray-300 text-gray-500 cursor-not-allowed'}`}
              >
                {isSubmitting ? '預約傳送中...' : '確認預約並送出'}
              </button>
            </form>
            <div className="mt-10 text-center border-t-4 border-black pt-8 pb-4">
              <p className="text-xl font-black mb-2">24H 預約服務電話</p>
              <a href="tel:0915926166" className="text-4xl sm:text-5xl font-black text-black hover:underline tracking-wider block font-black-stroke">0915-926-166</a>
            </div>
          </main>
        </div>
      );
    }
    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);
  </script>
</body>
</html>
