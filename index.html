<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>RS專車接送 詢價/預約</title>
  
  <!-- 載入 Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>
  
  <!-- 載入 React 核心 -->
  <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
  <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
  
  <!-- 載入 Babel (用於讓瀏覽器看得懂 React JSX 語法) -->
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  
  <!-- 修正沙盒/預覽環境的 UMD 模組載入衝突 -->
  <script>
    // 建立一個偽裝的 CommonJS 環境，讓 Lucide React 能順利找到全域的 React
    window.require = function(name) {
      if (name === 'react') return window.React;
      if (name === 'react-dom') return window.ReactDOM;
      return null;
    };
    window.module = { exports: {} };
    window.exports = window.module.exports;
    window.define = undefined; // 強制停用 AMD
  </script>

  <!-- 載入 Lucide Icons -->
  <script src="https://unpkg.com/lucide-react@0.344.0/dist/umd/lucide-react.js"></script>

  <script>
    // 確保 lucideReact 成功掛載到全域變數
    if (!window.lucideReact && window.module && window.module.exports && window.module.exports.Calendar) {
      window.lucideReact = window.module.exports;
    }
  </script>

  <!-- 載入 LINE LIFF SDK -->
  <script charset="utf-8" src="https://static.line-scdn.net/liff/edge/2/sdk.js"></script>
</head>
<body class="bg-gray-50 text-black font-sans">
  
  <!-- React App 將會渲染在這裡 -->
  <div id="root"></div>

  <!-- React 程式碼區塊 -->
  <script type="text/babel">
    const { useState, useEffect, useMemo } = React;
    
    // 安全備用圖示，防止圖示庫因網路問題載入失敗時導致整個畫面崩潰
    const FallbackIcon = () => <span></span>;
    const { 
      Calendar = FallbackIcon, Clock = FallbackIcon, MapPin = FallbackIcon, Phone = FallbackIcon, User = FallbackIcon, Plane = FallbackIcon, Car = FallbackIcon, 
      Briefcase = FallbackIcon, Users = FallbackIcon, CreditCard = FallbackIcon, Mail = FallbackIcon, FileText = FallbackIcon, CheckCircle = FallbackIcon, 
      AlertCircle = FallbackIcon, ShieldAlert = FallbackIcon, Crosshair = FallbackIcon, Receipt = FallbackIcon, Database = FallbackIcon, Send = FallbackIcon, RefreshCw = FallbackIcon, WifiOff = FallbackIcon
    } = window.lucideReact || {};

    // --- 設定區 ---
    const GAS_WEBAPP_URL = 'https://script.google.com/macros/s/AKfycbz2-KqpWDOJyJcvC-CJzYSdHSo6XCPU7AGKfbPs3Bfy8oK_hZoCo3Wq8tP8TokBraTLXw/exec';
    const GOOGLE_MAPS_API_KEY = 'AIzaSyAxYym5ZR8puPb0iiycHdwzTJTKH0Aears';
    const LINE_LIFF_ID = '2009753964-IEeYinij'; // 您的 LINE LIFF ID

    const DISTRICTS = {
      "台北市": ["100 中正區", "103 大同區", "104 中山區", "105 松山區", "106 大安區", "108 萬華區", "110 信義區", "111 士林區", "112 北投區", "114 內湖區", "115 南港區", "116 文山區"],
      "新北市": ["207 萬里區", "208 金山區", "220 板橋區", "221 汐止區", "222 深坑區", "223 石碇區", "224 瑞芳區", "226 平溪區", "227 雙溪區", "228 貢寮區", "231 新店區", "232 坪林區", "233 烏來區", "234 永和區", "235 中和區", "236 土城區", "237 三峽區", "238 樹林區", "239 鶯歌區", "241 三重區", "242 新莊區", "243 泰山區", "244 林口區", "247 蘆洲區", "248 五股區", "249 八里區", "251 淡水區", "252 三芝區", "253 石門區"],
      "桃園市": ["320 中壢區", "324 平鎮區", "325 龍潭區", "326 楊梅區", "327 新屋區", "328 觀音區", "330 桃園區", "333 龜山區", "334 八德區", "338 蘆竹區", "337 大園區", "335 大溪區", "336 復興區"]
    };

    const generateRandomString = (length) => {
      const chars = 'ABCDEFGHIJKLMNOPQRSTUVWXYZabcdefghijklmnopqrstuvwxyz';
      let result = '';
      for (let i = 0; i < length; i++) result += chars.charAt(Math.floor(Math.random() * chars.length));
      return result;
    };

    const generateReservationId = () => {
      const dateStr = new Date().toISOString().slice(0, 10).replace(/-/g, '');
      const randomDigits = Math.floor(1000 + Math.random() * 9000);
      const randomLetters = generateRandomString(3);
      return `RS${dateStr}${randomDigits}${randomLetters}`;
    };

    function App() {
      const [reservationId] = useState(generateReservationId());
      const [name, setName] = useState('');
      const [title, setTitle] = useState('先生');
      const [phone, setPhone] = useState('');
      const [date, setDate] = useState('');
      const [timeHour, setTimeHour] = useState('12');
      const [timeMinute, setTimeMinute] = useState('00');
      const [serviceType, setServiceType] = useState('送機');
      const [flightNumber, setFlightNumber] = useState('');
      const [airport, setAirport] = useState('桃園機場');
      const [carType, setCarType] = useState('小車');
      const [carryOn, setCarryOn] = useState(0);
      const [checkedBag, setCheckedBag] = useState(0);
      const [district, setDistrict] = useState('');
      const [address, setAddress] = useState('');
      const [adults, setAdults] = useState(1);
      const [children, setChildren] = useState(0);
      const [infants, setInfants] = useState(0);
      const [payment, setPayment] = useState('現金');
      const [email, setEmail] = useState('');
      const [remarks, setRemarks] = useState('');
      const [agreed, setAgreed] = useState(false);
      const [extraSignboard, setExtraSignboard] = useState(false);
      const [signboardText, setSignboardText] = useState('');
      const [extraMultiPoint, setExtraMultiPoint] = useState(false);

      const [priceMap, setPriceMap] = useState({});
      const [isLoadingPrices, setIsLoadingPrices] = useState(false);
      const [isSubmitting, setIsSubmitting] = useState(false);
      const [isOffline, setIsOffline] = useState(false);
      const [isLiffReady, setIsLiffReady] = useState(false);

      // 初始化 LINE LIFF
      useEffect(() => {
        if (window.liff) {
          window.liff.init({ liffId: LINE_LIFF_ID })
            .then(() => {
              console.log('LIFF 初始化成功');
              setIsLiffReady(true);
            })
            .catch((err) => {
              console.error('LIFF 初始化失敗', err);
            });
        }
      }, []);

      const fetchPrices = async () => {
        if (GAS_WEBAPP_URL.includes('YOUR_GAS_ID')) return;
        setIsLoadingPrices(true);
        setIsOffline(false);
        try {
          const response = await fetch(`${GAS_WEBAPP_URL}?action=getPrices`);
          const data = await response.json();
          if (data.status === 'success') setPriceMap(data.prices);
        } catch (err) {
          console.error('無法讀取價目表:', err);
          setIsOffline(true);
        } finally {
          setIsLoadingPrices(false);
        }
      };

      useEffect(() => {
        fetchPrices();
      }, []);

      const handlePhoneChange = (e) => {
        let val = e.target.value.replace(/\D/g, '');
        if (val.length > 10) val = val.slice(0, 10);
        let formatted = val;
        if (val.length > 7) formatted = `${val.slice(0, 4)}-${val.slice(4, 7)}-${val.slice(7)}`;
        else if (val.length > 4) formatted = `${val.slice(0, 4)}-${val.slice(4)}`;
        setPhone(formatted);
      };

      const handleFlightChange = (e) => {
        setFlightNumber(e.target.value.replace(/[^a-zA-Z0-9]/g, '').toUpperCase());
      };

      const handleGetLocation = () => {
        if (navigator.geolocation) {
          setAddress('定位轉換中...');
          navigator.geolocation.getCurrentPosition(
            async (pos) => {
              const lat = pos.coords.latitude;
              const lng = pos.coords.longitude;
              try {
                const response = await fetch(`https://maps.googleapis.com/maps/api/geocode/json?latlng=${lat},${lng}&key=${GOOGLE_MAPS_API_KEY}&language=zh-TW`);
                const data = await response.json();
                
                if (data.status === 'OK' && data.results.length > 0) {
                  let formattedAddress = data.results[0].formatted_address;
                  formattedAddress = formattedAddress.replace(/^台灣\d{3,5}\s*/, '');
                  setAddress(formattedAddress);
                } else {
                  // 顯示 Google 回傳的真實錯誤，方便排查 API Key 權限問題
                  console.error('Google Maps API 錯誤:', data);
                  alert(`Google Maps API 轉換失敗！\n狀態碼：${data.status}\n原因：${data.error_message || '請確認 API Key 是否已啟用 Geocoding API 且已綁定信用卡'}`);
                  setAddress(`GPS定位: ${lat.toFixed(4)}, ${lng.toFixed(4)}`);
                }
              } catch (err) {
                console.error('地理編碼連線失敗:', err);
                alert('網路連線異常，無法聯繫 Google Maps API。');
                setAddress(`GPS定位: ${lat.toFixed(4)}, ${lng.toFixed(4)}`);
              }
            }, 
            (error) => {
              setAddress('');
              alert('定位失敗，請確認是否允許瀏覽器存取位置權限，或請手動輸入。');
            }
          );
        } else {
          alert('您的瀏覽器不支援定位功能。');
        }
      };

      useEffect(() => {
        if (date && timeHour && timeMinute) {
          const selected = new Date(`${date}T${timeHour}:${timeMinute}:00`);
          const diffHours = (selected.getTime() - new Date().getTime()) / (1000 * 60 * 60);
          if (diffHours < 24 && diffHours > 0) {
            alert('預約時間小於24小時無法線上預約，請直接來電 0915926166。');
            setDate('');
          }
        }
      }, [date, timeHour, timeMinute]);

      useEffect(() => {
        const totalLuggage = Number(carryOn) + Number(checkedBag);
        const totalPassengers = Number(adults) + Number(children) + Number(infants);
        if (totalLuggage >= 3 || totalPassengers >= 5) {
          setCarType('大車');
        }
      }, [carryOn, checkedBag, adults, children, infants]);

      // 當機場變更時，若該機場的雲端價目表沒有目前的區域，則自動清空區域
      useEffect(() => {
        if (Object.keys(priceMap).length > 0 && district !== '') {
          const hasDistrict = Object.keys(priceMap).some(key => {
            const parts = key.split('_');
            return parts.length >= 2 && parts[0] === airport && parts[1] === district;
          });
          const hasAirportData = Object.keys(priceMap).some(key => key.startsWith(airport + '_'));
          
          if (hasAirportData && !hasDistrict) {
            setDistrict('');
          }
        }
      }, [airport, priceMap, district]);

      const isNightCharge = useMemo(() => {
        const hour = parseInt(timeHour, 10);
        return hour >= 22 || hour < 6;
      }, [timeHour]);

      const basePrice = useMemo(() => {
        const key = `${airport}_${district}`;
        const priceData = priceMap[key];
        if (!priceData) return 0;
        return carType === '大車' ? priceData.large : priceData.small;
      }, [priceMap, airport, district, carType]);

      const totalExtraFee = (serviceType === '接機' ? 200 : 0) + (isNightCharge ? 200 : 0) + (infants * 200) + (extraSignboard ? 200 : 0);
      const estimatedTotal = basePrice > 0 ? basePrice + totalExtraFee : null;

      const handleSubmit = async (e) => {
        e.preventDefault();
        if (!agreed || isSubmitting) return;

        const phoneDigits = phone.replace(/\D/g, '');
        if (phoneDigits.length !== 10 || !phoneDigits.startsWith('09')) {
          alert('請輸入 09 開頭的完整 10 碼電話！');
          return;
        }

        if (GAS_WEBAPP_URL.includes('YOUR_GAS_ID')) {
          alert('尚未設定 GAS 網址，暫時無法送出雲端預約。');
          return;
        }

        setIsSubmitting(true);
        
        const finalRemarks = extraSignboard && signboardText ? `【舉牌內容：${signboardText}】\n${remarks}` : remarks;

        const payload = {
          action: 'addReservation',
          data: {
            reservationId, name: `${name} ${title}`, phone, email, dateTime: `${date} ${timeHour}:${timeMinute}`,
            serviceType, airport, flightNumber, location: `${district} ${address}`, carType,
            passengers: `成人:${adults}, 小孩:${children}, 幼童:${infants}`,
            luggage: `登機箱:${carryOn}, 託運:${checkedBag}`,
            payment, basePrice, extraFee: totalExtraFee, totalFee: estimatedTotal || '待報價',
            isNight: isNightCharge ? '是' : '否', remarks: finalRemarks, timestamp: new Date().toLocaleString('zh-TW', { timeZone: 'Asia/Taipei' })
          }
        };

        try {
          // 1. 拋送資料到 Google Apps Script (寫入 Google 試算表)
          await fetch(GAS_WEBAPP_URL, { method: 'POST', mode: 'no-cors', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(payload) });
          
          // 2. 透過 LINE LIFF 自動發送完整的預約明細回聊天室
          if (window.liff && window.liff.isInClient()) {
            await window.liff.sendMessages([
              {
                type: 'text',
                text: `【RS專車接送 線上預約單】\n預約編號：${reservationId}\n乘車人：${name} ${title}\n聯絡電話：${phone}\n乘車時間：${date} ${timeHour}:${timeMinute}\n服務類型：${serviceType}\n機場/航班：${airport} / ${flightNumber}\n接送地址：${district} ${address}\n車型：${carType}\n人數：大人${adults} 小孩${children} 幼童${infants}\n行李：登機箱${carryOn} 託運${checkedBag}\n預估總額：${estimatedTotal ? '$' + estimatedTotal : '待報價'} (${payment})\n${finalRemarks ? '備註：\n' + finalRemarks : ''}`
              }
            ]);
            alert(`預約已提交成功！即將關閉視窗。\n編號：${reservationId}`);
            window.liff.closeWindow(); // 自動關閉視窗
          } else {
            alert(`預約已提交成功！\n編號：${reservationId}`);
          }
          
        } catch (err) {
          alert('提交至雲端時發生錯誤。');
        } finally {
          setIsSubmitting(false);
        }
      };

      const renderNumberOptions = (min, max) => Array.from({ length: Math.max(0, max - min + 1) }, (_, i) => i + min).map(num => (
        <option key={num} value={num}>{num}</option>
      ));

      // 動態渲染接送區域選項 (從 Google 試算表抓取)
      const renderDistrictOptions = () => {
        if (isLoadingPrices) return null;

        const dynamicDists = new Set();
        Object.keys(priceMap).forEach(key => {
          const parts = key.split('_');
          if (parts.length >= 2 && parts[0] === airport) {
            dynamicDists.add(parts[1]);
          }
        });

        if (dynamicDists.size > 0) {
          // 直接回傳選項，移除 optgroup 群組標題
          return Array.from(dynamicDists).sort().map(d => (
            <option key={d} value={d}>{d}</option>
          ));
        }

        // 離線或無資料的備用顯示
        return Object.entries(DISTRICTS).map(([city, dists]) => (
          <optgroup label={`${city} (無雲端資料)`} key={city}>
            {dists.map(d => <option key={d} value={d}>{d}</option>)}
          </optgroup>
        ));
      };

      return (
        <div className="pb-10">
          <header className="bg-black text-white p-4 sticky top-0 z-50 shadow-md flex justify-center items-center relative">
            <h1 className="text-xl font-bold tracking-wider">RS專車接送 詢價/預約</h1>
            <div className="flex gap-4 absolute right-4">
              <button onClick={fetchPrices} type="button">
                <RefreshCw className={`w-5 h-5 ${isLoadingPrices ? 'animate-spin text-green-400' : 'text-gray-400'}`} />
              </button>
              <Database className={`w-5 h-5 ${isSubmitting ? 'animate-bounce text-yellow-400' : 'text-gray-500'}`} />
            </div>
          </header>

          <main className="max-w-md mx-auto mt-6 bg-white shadow-lg p-6 sm:p-8 sm:border sm:border-gray-200">
            <form onSubmit={handleSubmit} className="space-y-6">
              <div className="bg-gray-100 p-3 flex justify-between items-center border border-gray-300">
                <span className="text-sm font-bold flex items-center gap-2 text-gray-600"><FileText className="w-4 h-4" /> 預約編號</span>
                <span className="font-mono text-sm font-bold">{reservationId}</span>
              </div>

              {/* 乘車人資訊 */}
              <section className="space-y-4">
                <h2 className="text-lg font-bold border-b-2 border-black pb-2 flex items-center gap-2"><User className="w-5 h-5" /> 乘車人資訊</h2>
                <div className="flex gap-2">
                  <input type="text" required className="flex-1 p-2 border border-gray-300 outline-none focus:border-black" placeholder="請輸入真實姓名" value={name} onChange={e => setName(e.target.value)} />
                  <select className="w-24 p-2 border border-gray-300 bg-white" value={title} onChange={e => setTitle(e.target.value)}><option>先生</option><option>小姐</option></select>
                </div>
                <div className="relative">
                  <Phone className="w-5 h-5 absolute left-3 top-2.5 text-gray-400" />
                  <input type="tel" required className="w-full p-2 pl-10 border border-gray-300 font-mono outline-none focus:border-black" value={phone} onChange={handlePhoneChange} placeholder="0900-000-000" />
                </div>
                <div className="relative">
                  <Mail className="w-5 h-5 absolute left-3 top-2.5 text-gray-400" />
                  <input type="email" required className="w-full p-2 pl-10 border border-gray-300 outline-none focus:border-black" value={email} onChange={e => setEmail(e.target.value)} placeholder="電子信箱 EMAIL" />
                </div>

                <div className="pt-2 border-t border-gray-100 mt-2">
                  <label className="block text-xs font-bold text-gray-700 mb-1 font-mono flex items-center gap-1">
                    <MapPin className="w-3 h-3" /> 接送地址
                  </label>
                  <select required className="w-full p-2 border border-gray-300 bg-white mb-2 outline-none focus:border-black" value={district} onChange={e => setDistrict(e.target.value)}>
                    <option value="">{isLoadingPrices ? '載入雲端區域中...' : '請選擇區域'}</option>
                    {renderDistrictOptions()}
                  </select>
                  <div className="flex gap-2">
                    <input type="text" required className="flex-1 p-2 border border-gray-300 outline-none focus:border-black" value={address} onChange={e => setAddress(e.target.value)} placeholder="詳細地址" />
                    <button type="button" onClick={handleGetLocation} className="bg-black text-white px-3 py-2 active:bg-gray-800"><Crosshair className="w-5 h-5" /></button>
                  </div>
                </div>
              </section>

              {/* 乘車資訊 */}
              <section className="space-y-4">
                <h2 className="text-lg font-bold border-b-2 border-black pb-2 flex items-center gap-2 mt-8"><Calendar className="w-5 h-5" /> 乘車資訊</h2>
                <label className="block text-xs font-bold text-gray-700">
                  乘車日期 <span className="text-red-500 font-bold">(小於24H無法線上預約，請直接來電)</span>
                </label>
                <input type="date" required className="w-full p-2 border border-gray-300 outline-none focus:border-black" value={date} onChange={e => setDate(e.target.value)} />
                <div className="flex gap-2">
                  <select className="flex-1 p-2 border border-gray-300 bg-white outline-none focus:border-black" value={timeHour} onChange={e => setTimeHour(e.target.value)}>{Array.from({length:24},(_,i)=>i.toString().padStart(2,'0')).map(h=><option key={h} value={h}>{h}</option>)}</select>
                  <select className="flex-1 p-2 border border-gray-300 bg-white outline-none focus:border-black" value={timeMinute} onChange={e => setTimeMinute(e.target.value)}>{Array.from({length:12},(_,i)=>(i*5).toString().padStart(2,'0')).map(m=><option key={m} value={m}>{m}</option>)}</select>
                </div>
                <div className="grid grid-cols-2 gap-4">
                  <select className="p-2 border border-gray-300 bg-white outline-none focus:border-black" value={serviceType} onChange={e => setServiceType(e.target.value)}><option value="送機">送機</option><option value="接機">接機 (+ $200)</option></select>
                  <select className="p-2 border border-gray-300 bg-white outline-none focus:border-black" value={airport} onChange={e => setAirport(e.target.value)}><option>桃園機場</option><option>松山機場</option><option>台中機場</option></select>
                </div>
                <input type="text" required className="w-full p-2 border border-gray-300 font-mono uppercase outline-none focus:border-black" value={flightNumber} onChange={handleFlightChange} placeholder="航班編號 EX: BR123" />
              </section>

              {/* 車型與人數行李 */}
              <section className="space-y-4">
                <h2 className="text-lg font-bold border-b-2 border-black pb-2 flex items-center gap-2 mt-8">
                  <Car className="w-5 h-5" /> 車型與人數行李 <span className="text-red-500 font-bold">(最多6人6件)</span>
                </h2>
                {((Number(carryOn) + Number(checkedBag)) >= 3 || (Number(adults) + Number(children) + Number(infants)) >= 5) && (
                  <p className="text-xs font-bold text-red-500 mb-1">※ 行李達 3 件或人數達 5 人，已強制選擇大車</p>
                )}
                <select 
                  className="w-full p-2 border border-gray-300 bg-white outline-none focus:border-black" 
                  value={carType} 
                  onChange={e => setCarType(e.target.value)} 
                  disabled={(Number(carryOn)+Number(checkedBag))>=3 || (Number(adults)+Number(children)+Number(infants))>=5}
                >
                  <option value="小車">小車</option>
                  <option value="大車">大車</option>
                </select>
                <div className="grid grid-cols-3 gap-2 text-center text-[10px] text-gray-500 font-bold uppercase">
                  <div>大人<select className="w-full p-2 border text-black bg-white outline-none" value={adults} onChange={e=>setAdults(Number(e.target.value))}>{renderNumberOptions(1, 6-children-infants)}</select></div>
                  <div>4~12歲<select className="w-full p-2 border text-black bg-white outline-none" value={children} onChange={e=>setChildren(Number(e.target.value))}>{renderNumberOptions(0, 6-adults-infants)}</select></div>
                  <div>4歲以下<select className="w-full p-2 border text-black bg-white outline-none" value={infants} onChange={e=>setInfants(Number(e.target.value))}>{renderNumberOptions(0, 6-adults-children)}</select></div>
                </div>
                <div className="grid grid-cols-2 gap-2 text-center text-[10px] text-gray-500 font-bold uppercase">
                  <div>登機箱<select className="w-full p-2 border text-black bg-white outline-none" value={carryOn} onChange={e=>setCarryOn(Number(e.target.value))}>{renderNumberOptions(0, 6-checkedBag)}</select></div>
                  <div>託運 <span className="text-red-500 font-bold">(21~29吋)</span><select className="w-full p-2 border text-black bg-white outline-none" value={checkedBag} onChange={e=>setCheckedBag(Number(e.target.value))}>{renderNumberOptions(0, 6-carryOn)}</select></div>
                </div>
              </section>

              {/* 費用與備註 */}
              <section className="space-y-4">
                <h2 className="text-lg font-bold border-b-2 border-black pb-2 flex items-center gap-2 mt-8"><CreditCard className="w-5 h-5" /> 費用估算與付款</h2>
                
                <div className="flex flex-col gap-3 bg-gray-50 p-3 border border-gray-200 text-sm font-bold">
                  <div className="flex flex-col gap-2">
                    <label className="flex items-center gap-2 cursor-pointer">
                      <input type="checkbox" className="w-4 h-4 accent-black" checked={extraSignboard} onChange={e=>{
                        setExtraSignboard(e.target.checked);
                        if (!e.target.checked) setSignboardText('');
                      }} />
                      舉牌服務 (+$200)
                    </label>
                    {extraSignboard && (
                      <input 
                        type="text" 
                        className="ml-6 p-2 border border-gray-300 outline-none focus:border-black font-normal"
                        placeholder="請輸入舉牌內容（例：貴賓姓名）"
                        value={signboardText}
                        onChange={e => setSignboardText(e.target.value)}
                        required={extraSignboard}
                      />
                    )}
                  </div>
                  <label className="flex items-center gap-2 cursor-pointer"><input type="checkbox" className="w-4 h-4 accent-black" checked={extraMultiPoint} onChange={e=>setExtraMultiPoint(e.target.checked)} />多點接送 (由客服另行報價)</label>
                </div>

                <div>
                  <label className="block text-xs font-bold text-gray-700 mb-1">付款方式</label>
                  <select className="w-full p-2 border border-gray-300 bg-white outline-none focus:border-black" value={payment} onChange={e => setPayment(e.target.value)}>
                    <option value="現金">現金</option>
                    <option value="轉帳">轉帳</option>
                    <option value="簽單月結">簽單月結 (限簽約客戶)</option>
                  </select>
                </div>

                <div className="bg-black text-white p-5 relative overflow-hidden shadow-xl border-t-4 border-yellow-400">
                  <Receipt className="absolute top-0 right-0 p-4 opacity-10 w-24 h-24" />
                  <h3 className="font-bold border-b border-gray-700 pb-2 mb-3 text-sm flex items-center gap-2"><Receipt className="w-4 h-4" /> 報價明細</h3>
                  <div className="space-y-2 text-sm font-mono">
                    <div className="flex justify-between"><span>{airport} - {district || '未選區'}</span><span className="text-yellow-400 font-bold">{basePrice > 0 ? `$${basePrice}` : '待報價'}</span></div>
                    {totalExtraFee > 0 && (
                      <div className="pt-2 border-t border-gray-800 border-dashed text-xs text-gray-400 space-y-1">
                        {(serviceType === '接機') && <div className="flex justify-between"><span>└ 接機服務</span><span>+$200</span></div>}
                        {isNightCharge && <div className="flex justify-between"><span>└ 夜間加成 (22:00-06:00)</span><span>+$200</span></div>}
                        {infants > 0 && <div className="flex justify-between"><span>└ 安全座椅 x {infants}</span><span>+${infants * 200}</span></div>}
                        {extraSignboard && <div className="flex justify-between"><span>└ 舉牌服務</span><span>+$200</span></div>}
                      </div>
                    )}
                    <div className="mt-4 pt-3 border-t border-gray-700 flex justify-between items-end">
                      <span className="font-bold text-gray-300 text-xs">預計總金額</span>
                      <span className="text-3xl font-black text-white">{estimatedTotal ? `$${estimatedTotal}` : '待報價'}</span>
                    </div>
                  </div>
                </div>

                <div>
                  <label className="block text-xs font-bold text-gray-700 mb-1">其他備註</label>
                  <textarea 
                    className="w-full p-2 border border-gray-300 outline-none h-24 text-sm focus:border-black"
                    value={remarks} onChange={e => setRemarks(e.target.value)}
                    placeholder="如攜帶紙箱、運動版行李箱(胖胖箱)、高爾夫球具、雪板、輪椅、腳踏車箱、大型樂器...等，請務必告知。其他需要我們注意的事項也可在這說明。"
                  ></textarea>
                </div>
              </section>

              {/* 注意事項 */}
              <section className="mt-8 border-t-2 border-black pt-6">
                <div className="bg-gray-100 p-4 border border-gray-300 h-64 overflow-y-auto text-[10px] text-gray-600 mb-4 leading-relaxed">
                  <h3 className="font-bold text-black mb-2 flex items-center gap-1"><ShieldAlert className="w-3 h-3" /> 【注意事項】</h3>
                  <div className="space-y-2">
                    <p>1、如預約時無加點行程、當天服務司機無法多停上下車點(車輛均有 GPS )請體諒司機無法私自增加停靠點若臨時多加上下車點，可以告知司機請司機回報公司後方可執行「時加點服務」。</p>
                    <p>2、依實際人數及行李件數尺寸預約車款。</p>
                    <p>3、為了行車安全及法規，乘車時請繫上安全帶，車內座位區、腳墊區不得放置行李(隨身行李背包除外)。預約時請評估行李箱大小決定車種，司機現場服務時遇實際件數與預約資料不符時，本公司有權利終止租用車輛拒絕服務且該趟行程將視同已使用。</p>
                    <p>4、為維護乘車品質，顧及每位貴賓權益，車內勿飲食。</p>
                    <p>5、因應政府「小型車附載幼童安全乘坐實施及宣導辦法」規範：2 歲以下兒童乘坐小客車，需繫安全帶或使用安全座椅(增高墊)乘坐。嬰幼兒若在 0~4 歲且體重 18 公斤內，強制使用安全座椅。(此項目受法令規範，如未依實際需求數量加購與安裝安全椅/增高墊：所有一切責任(罰款)將由乘車人承擔。)</p>
                  </div>
                </div>
                <label className="flex items-start gap-2 cursor-pointer p-3 border border-black font-bold text-sm">
                  <input type="checkbox" required className="w-5 h-5 accent-black" checked={agreed} onChange={e=>setAgreed(e.target.checked)} />
                  我已確認預約資訊並同意免責聲明
                </label>
              </section>

              <button 
                type="submit" 
                disabled={!agreed || isSubmitting} 
                className={`w-full py-4 text-lg font-bold flex items-center justify-center gap-2 transition-all ${agreed && !isSubmitting ? 'bg-black text-white shadow-lg active:scale-95' : 'bg-gray-300 text-gray-500 cursor-not-allowed'}`}
              >
                {isSubmitting ? <><RefreshCw className="animate-spin w-6 h-6" /> 雲端寫入中...</> : <><Send className="w-6 h-6" /> 確認送出預約</>}
              </button>
            </form>

            <div className="mt-8 text-center border-t border-gray-100 pt-6">
              <p className="text-sm text-gray-500 font-mono">24H 預約服務電話</p>
              <a href="tel:0915926166" className="text-xl font-black hover:underline tracking-widest font-mono">0915-926-166</a>
            </div>
          </main>
        </div>
      );
    }

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);
  </script>
</body>
</html>
