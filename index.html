<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>RS專車接送 詢價/預約</title>
  
  <script src="https://cdn.tailwindcss.com"></script>
  <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
  <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  
  <script>
    window.require = function(name) {
      if (name === 'react') return window.React;
      if (name === 'react-dom') return window.ReactDOM;
      return null;
    };
    window.module = { exports: {} };
    window.exports = window.module.exports;
    window.define = undefined;
  </script>

  <script src="https://unpkg.com/lucide-react@0.344.0/dist/umd/lucide-react.js"></script>

  <script>
    if (!window.lucideReact && window.module && window.module.exports && window.module.exports.Calendar) {
      window.lucideReact = window.module.exports;
    }
  </script>

  <script charset="utf-8" src="https://static.line-scdn.net/liff/edge/2/sdk.js"></script>
  <style>
    .justify-text {
      text-align: justify;
      text-justify: inter-ideograph;
    }
    .font-black-stroke {
      -webkit-text-stroke: 1.5px #0ABAB5;
    }
    @keyframes pulse-red {
      0%, 100% { opacity: 1; }
      50% { opacity: 0.7; }
    }
    .animate-pulse-red {
      animation: pulse-red 2s cubic-bezier(0.4, 0, 0.6, 1) infinite;
    }
    /* 自定義捲軸 */
    ::-webkit-scrollbar {
      width: 6px;
    }
    ::-webkit-scrollbar-thumb {
      background: #0ABAB5;
      border-radius: 10px;
    }
  </style>
</head>
<body class="bg-gray-50 text-black font-sans">
  
  <div id="root"></div>

  <script type="text/babel">
    const { useState, useEffect, useMemo, useRef, useCallback } = React;
    
    const FallbackIcon = () => <span></span>;
    const { 
      Calendar = FallbackIcon, Clock = FallbackIcon, MapPin = FallbackIcon, Phone = FallbackIcon, User = FallbackIcon, Plane = FallbackIcon, Car = FallbackIcon, 
      Briefcase = FallbackIcon, Users = FallbackIcon, CreditCard = FallbackIcon, Mail = FallbackIcon, FileText = FallbackIcon, CheckCircle = FallbackIcon, 
      ShieldAlert = FallbackIcon, Receipt = FallbackIcon, Database = FallbackIcon, Send = FallbackIcon, RefreshCw = FallbackIcon, Search = FallbackIcon, X = FallbackIcon, AlertCircle = FallbackIcon, PlusCircle = FallbackIcon, Info = FallbackIcon
    } = window.lucideReact || {};

    const GAS_WEBAPP_URL = 'https://script.google.com/macros/s/AKfycbwbTEF9LBnj2RB7cKgaFujfwCfG15sCMfL7REds-3oTeWQ-FTHU8c_DRPGgsH6LRsAZ_w/exec';
    const GOOGLE_MAPS_API_KEY = 'AIzaSyAxYym5ZR8puPb0iiycHdwzTJTKH0Aears';
    const LINE_LIFF_ID = '2009753964-IEeYinij';

    const DISTRICTS_FALLBACK = {
      "台北市": ["100 台北市 中正區", "103 台北市 大同區", "104 台北市 中山區", "105 台北市 松山區", "106 台北市 大安區", "108 台北市 萬華區", "110 台北市 信義區", "111 台北市 士林區", "112 台北市 北投區", "114 台北市 內湖區", "115 台北市 南港區", "116 台北市 文山區"],
      "新北市": ["207 新北市 萬里區", "208 新北市 金山區", "220 新北市 板橋區", "221 新北市 汐止區", "222 新北市 深坑區", "223 新北市 石碇區", "224 新北市 瑞芳區", "226 新北市 平溪區", "227 新北市 雙溪區", "228 新北市 貢寮區", "231 新北市 新店區", "232 新北市 坪林區", "233 新北市 烏來區", "234 新北市 永和區", "235 新北市 中和區", "236 新北市 土城區", "237 新北市 三峽區", "238 新北市 樹林區", "239 新北市 鶯歌區", "241 新北市 三重區", "242 新北市 新莊區", "243 新北市 泰山區", "244 新北市 林口區", "247 新北市 蘆洲區", "248 新北市 五股區", "249 新北市 八里區", "251 新北市 淡水區", "252 新北市 三芝區", "253 新北市 石門區"]
    };

    const generateReservationId = () => {
      const now = new Date();
      const dateStr = `${now.getFullYear()}${String(now.getMonth() + 1).padStart(2, '0')}${String(now.getDate()).padStart(2, '0')}`;
      const randomDigits = Math.floor(1000 + Math.random() * 9000);
      const chars = 'ABCDEFGHIJKLMNOPQRSTUVWXYZabcdefghijklmnopqrstuvwxyz';
      let randomChars = '';
      for (let i = 0; i < 3; i++) {
        randomChars += chars.charAt(Math.floor(Math.random() * chars.length));
      }
      return `RS${dateStr}${randomDigits}${randomChars}`;
    };

    function CustomModal({ isOpen, onClose, onConfirm, title, message, type = 'info', isSubmitting = false }) {
      if (!isOpen) return null;
      return (
        <div className="fixed inset-0 z-[999] flex items-center justify-center p-4 bg-black/60 backdrop-blur-sm text-center">
          <div className="bg-white w-full max-w-sm rounded-lg shadow-2xl overflow-hidden animate-in zoom-in-95 duration-200 flex flex-col max-h-[85vh]">
            <div className="bg-[#0ABAB5] p-4 flex justify-between items-center text-white shrink-0">
              <div className="flex items-center gap-2 font-bold tracking-wider uppercase text-sm">
                {type === 'error' ? <AlertCircle className="w-4 h-4 text-red-100" /> : 
                 type === 'confirm' ? <FileText className="w-4 h-4 text-white" /> :
                 <CheckCircle className="w-4 h-4 text-white" />}
                {title}
              </div>
              <button onClick={onClose} disabled={isSubmitting}><X className="w-5 h-5 opacity-70 hover:opacity-100" /></button>
            </div>
            <div className="p-6 flex-1 overflow-y-auto text-left text-sm">
              <div className="text-gray-700 leading-relaxed font-bold whitespace-pre-wrap">{message}</div>
            </div>
            <div className="p-4 bg-white border-t border-gray-100 shrink-0 flex gap-2">
              {type === 'confirm' ? (
                <>
                  <button onClick={onClose} disabled={isSubmitting} className="w-1/3 py-3 bg-gray-100 text-gray-700 font-black rounded-sm active:scale-95 transition-transform disabled:opacity-50 border border-gray-200">返回修改</button>
                  <button onClick={onConfirm} disabled={isSubmitting} className="w-2/3 py-3 bg-[#0ABAB5] text-white font-black rounded-sm active:scale-95 transition-transform disabled:opacity-50 flex justify-center items-center gap-2">
                    {isSubmitting ? '處理中...' : '確認無誤並送出'}
                  </button>
                </>
              ) : (
                <button onClick={onClose} className="w-full py-3 bg-[#0ABAB5] text-white font-black rounded-sm active:scale-95 transition-transform">確定</button>
              )}
            </div>
          </div>
        </div>
      );
    }

    function App() {
      const [reservationId] = useState(generateReservationId());
      const [name, setName] = useState('');
      const [title, setTitle] = useState('先生');
      const [phone, setPhone] = useState('');
      const [email, setEmail] = useState('');
      const [date, setDate] = useState('');
      const [timeHour, setTimeHour] = useState('12');
      const [timeMinute, setTimeMinute] = useState('00');
      const [serviceType, setServiceType] = useState('送機');
      const [flightNumber, setFlightNumber] = useState('');
      const [airport, setAirport] = useState('桃園機場');
      const [carType, setCarType] = useState('小車');
      const [carryOn, setCarryOn] = useState(0);
      const [checkedBag, setCheckedBag] = useState(0);
      const [adults, setAdults] = useState(1);
      const [children, setChildren] = useState(0);
      const [infants, setInfants] = useState(0);
      const [district, setDistrict] = useState('');
      const [address, setAddress] = useState('');
      const [hasExtraPoint, setHasExtraPoint] = useState(false);
      const [extraDistrict, setExtraDistrict] = useState('');
      const [extraAddress, setExtraAddress] = useState('');
      const [payment, setPayment] = useState('現金');
      const [remarks, setRemarks] = useState('');
      const [agreed, setAgreed] = useState(false);
      const [extraSignboard, setExtraSignboard] = useState(false);
      const [signboardText, setSignboardText] = useState('');
      const [priceMap, setPriceMap] = useState({});
      const [isLoadingPrices, setIsLoadingPrices] = useState(false);
      const [isSubmitting, setIsSubmitting] = useState(false);
      const [mapsError, setMapsError] = useState(false);
      const [modal, setModal] = useState({ open: false, title: '', message: '', type: 'info', onConfirm: null });
      const [confirmData, setConfirmData] = useState(null); 
      
      const addressInputRef = useRef(null);
      const extraAddressInputRef = useRef(null);

      const showAlert = useCallback((msg, title = '系統訊息', type = 'info', onConfirm = null) => {
        setModal({ open: true, title, message: msg, type, onConfirm });
      }, []);

      const handleFlightChange = (e) => {
        setFlightNumber(e.target.value.replace(/[^a-zA-Z0-9]/g, '').toUpperCase());
      };

      useEffect(() => {
        const initLiff = async () => {
          if (window.liff) {
            try {
              await window.liff.init({ liffId: LINE_LIFF_ID });
              console.log('LIFF Ready');
            } catch (err) {
              console.error('LIFF Init Error:', err);
            }
          }
        };
        initLiff();
        
        window.gm_authFailure = () => {
          setMapsError(true);
          showAlert("【地圖提示】地圖補全功能無法載入，請改手動輸入地址預約。", "地圖服務", "error");
        };
      }, [showAlert]);

      const carTypeConstraint = useMemo(() => {
        const totalLuggage = Number(carryOn) + Number(checkedBag);
        const totalPeople = Number(adults) + Number(children) + Number(infants);
        if (totalLuggage >= 3 || totalPeople >= 5) {
          return { isForced: true, reason: totalLuggage >= 3 ? "行李達 3 件以上" : "人數達 5 人以上" };
        }
        return { isForced: false, reason: '' };
      }, [carryOn, checkedBag, adults, children, infants]);

      useEffect(() => {
        if (carTypeConstraint.isForced) setCarType('大車');
      }, [carTypeConstraint]);

      useEffect(() => {
        if (date && timeHour && timeMinute) {
          const selectedDate = new Date(`${date}T${timeHour}:${timeMinute}:00`);
          const now = new Date();
          const diffHours = (selectedDate.getTime() - now.getTime()) / (1000 * 60 * 60);
          if (diffHours < 24) {
            showAlert('預約需大於 24 小時，急件請撥 0915-926-166。', '時間限制', 'error');
            setDate(''); 
          }
        }
      }, [date, timeHour, timeMinute, showAlert]);

      // 修正後的精準解析行政區邏輯
      const parsePlaceToDistrictAndAddress = (place, distSetter, addrSetter) => {
        const components = place.address_components || [];
        const fullAddr = place.formatted_address || "";
        
        // 1. 抓取 3 碼郵遞區號 (包含備援匹配)
        let zipCode = "";
        const postCodeObj = components.find(c => c.types.includes('postal_code'));
        if (postCodeObj) {
          zipCode = postCodeObj.long_name.substring(0, 3);
        } else {
          const zipMatch = fullAddr.match(/(\d{3,5})/);
          if (zipMatch) zipCode = zipMatch[1].substring(0, 3);
        }

        // 2. 抓取第一層：縣市
        const cityComp = components.find(c => c.types.includes('administrative_area_level_1'));
        const cityName = (cityComp ? cityComp.long_name : "").replace(/\d+/g, '').replace('台灣', '').trim();

        // 3. 抓取第二層：行政區 (例如：東區、香山區、竹東鎮、頭份市)
        // 優先搜尋 sublocality_level_1，其次搜尋 locality
        let areaName = "";
        const subLocality = components.find(c => c.types.includes('sublocality_level_1'));
        const locality = components.find(c => c.types.includes('locality'));
        
        if (subLocality && subLocality.long_name !== cityName) {
          areaName = subLocality.long_name;
        } else if (locality && locality.long_name !== cityName) {
          areaName = locality.long_name;
        }
        
        // 清理名稱中的數字（例如解決 310 310 問題）
        const cleanAreaName = areaName.replace(/\d+/g, '').trim();

        // 4. 組合最終格式：310 新竹縣 竹東鎮 (嚴格對應價目表)
        const priceListFormat = `${zipCode} ${cityName} ${cleanAreaName}`.replace(/\s+/g, ' ').trim();
        distSetter(priceListFormat);
        
        // 5. 清理詳細地址 (避免開頭重複資訊)
        let cleanAddr = fullAddr
          .replace(/^台灣\d{3,5}\s*/, '')
          .replace(/^台灣/, '')
          .replace(cityName, '')
          .replace(cleanAreaName, '')
          .replace(/^\d{3,5}/, '')
          .trim();
          
        addrSetter(cleanAddr);
      };

      useEffect(() => {
        const initAutocomplete = (ref, addrSetter, distSetter) => {
          if (ref.current && window.google?.maps?.places) {
            const autocomplete = new window.google.maps.places.Autocomplete(ref.current, {
              types: ['geocode', 'establishment'],
              componentRestrictions: { country: 'tw' }
            });
            autocomplete.addListener('place_changed', () => {
              const place = autocomplete.getPlace();
              if (place.formatted_address) {
                parsePlaceToDistrictAndAddress(place, distSetter, addrSetter);
              }
            });
          }
        };
        if (!window.google) {
          const script = document.createElement('script');
          script.src = `https://maps.googleapis.com/maps/api/js?key=${GOOGLE_MAPS_API_KEY}&libraries=places&language=zh-TW`;
          script.async = true; script.defer = true;
          script.onload = () => {
            initAutocomplete(addressInputRef, setAddress, setDistrict);
            if (hasExtraPoint) initAutocomplete(extraAddressInputRef, setExtraAddress, setExtraDistrict);
          };
          document.head.appendChild(script);
        } else {
          initAutocomplete(addressInputRef, setAddress, setDistrict);
          if (hasExtraPoint) initAutocomplete(extraAddressInputRef, setExtraAddress, setExtraDistrict);
        }
      }, [hasExtraPoint]);

      useEffect(() => { fetchPrices(); }, []);

      const fetchPrices = async () => {
        setIsLoadingPrices(true);
        try {
          const response = await fetch(`${GAS_WEBAPP_URL}?action=getPrices`);
          const data = await response.json();
          if (data.status === 'success') setPriceMap(data.prices);
        } catch (err) { console.error(err); } finally { setIsLoadingPrices(false); }
      };

      const handlePhoneChange = (e) => {
        let val = e.target.value.replace(/\D/g, '').slice(0, 10);
        let formatted = val;
        if (val.length > 7) formatted = `${val.slice(0, 4)}-${val.slice(4, 7)}-${val.slice(7)}`;
        else if (val.length > 4) formatted = `${val.slice(0, 4)}-${val.slice(4)}`;
        setPhone(formatted);
      };

      const basePriceInfo = useMemo(() => {
        let mainPrice = 0, extraPrice = 0;
        if (district) {
          const data = priceMap[`${airport}_${district}`];
          if (data) mainPrice = carType === '大車' ? data.large : data.small;
        }
        if (hasExtraPoint && extraDistrict) {
          const data = priceMap[`${airport}_${extraDistrict}`];
          if (data) extraPrice = carType === '大車' ? data.large : data.small;
        }
        return (hasExtraPoint && extraPrice > mainPrice) ? { price: extraPrice, name: extraDistrict } : { price: mainPrice, name: district };
      }, [priceMap, airport, district, extraDistrict, hasExtraPoint, carType]);

      const fees = useMemo(() => {
        const pickupFee = serviceType === '接機' ? 200 : 0;
        const h = parseInt(timeHour);
        const nightFee = (h >= 22 || h < 6) ? 200 : 0;
        const extraPointFee = (hasExtraPoint && district && extraDistrict) ? (district.substring(0, 3) === extraDistrict.substring(0, 3) ? 100 : 200) : 0;
        return { pickupFee, nightFee, infantSeatFee: infants * 200, signboardFee: extraSignboard ? 200 : 0, extraPointFee };
      }, [serviceType, timeHour, infants, extraSignboard, hasExtraPoint, district, extraDistrict]);

      const estimatedTotal = useMemo(() => {
        const extra = Object.values(fees).reduce((a, b) => a + b, 0);
        return basePriceInfo.price > 0 ? basePriceInfo.price + extra : null;
      }, [basePriceInfo.price, fees]);

      const executeSubmit = async (payload, lineText) => {
        if (isSubmitting) return;
        setIsSubmitting(true);
        
        try {
          const gasTask = fetch(GAS_WEBAPP_URL, { method: 'POST', mode: 'no-cors', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(payload) });

          let liffSent = false;
          if (window.liff) {
            const isInLine = (window.liff.isInClient() || /Line/i.test(navigator.userAgent));
            if (isInLine) {
              try {
                if (!window.liff.id) await window.liff.init({ liffId: LINE_LIFF_ID });
                await window.liff.sendMessages([{ type: 'text', text: lineText }]);
                liffSent = true;
              } catch (e) { console.error('LINE回傳失敗:', e); }
            }
          }

          await gasTask;

          if (liffSent) {
            showAlert(`🌟 預約成功！明細已回傳至您的 LINE 聊天室。\n(確定後將自動關閉視窗)`, '預約成功', 'success', () => {
              if (window.liff && window.liff.isInClient()) window.liff.closeWindow();
            });
          } else {
            showAlert(`🌟 預約成功！\n\n(非 LINE App 內開啟，請截圖保存)\n\n⬇️ 預約明細 ⬇️\n\n${lineText}`, '預約成功', 'success');
          }
        } catch (err) { showAlert('資料傳送過程中發生錯誤。', '系統錯誤', 'error'); } 
        finally { setIsSubmitting(false); setConfirmData(null); }
      };

      const handleSubmit = async (e) => {
        e.preventDefault();
        const missing = [];
        if (!name.trim()) missing.push('乘車人姓名');
        if (phone.replace(/\D/g, '').length !== 10) missing.push('聯絡電話 (需10碼)');
        if (!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email)) missing.push('信箱格式');
        if (!district) missing.push('接送區域');
        if (!address) missing.push('詳細地址');
        if (!date) missing.push('乘車日期');
        if (!flightNumber) missing.push('航班編號');
        if (extraSignboard && !signboardText.trim()) missing.push('舉牌內容');
        if (!agreed) missing.push('同意注意事項');

        if (missing.length > 0) return showAlert(`請檢查欄位：\n• ${missing.join('\n• ')}`, '資料不全', 'error');

        const lineText = `【RS專車接送 線上預約單】
預約編號：${reservationId}
乘車人姓名：${name} ${title}
乘車人電話：${phone}
電子信箱：${email}
乘車日期：${date}
乘車時間：${timeHour}:${timeMinute}
服務類型：${serviceType}
接送機場：${airport}
航班編號：${flightNumber}
接送地址：${district} ${address}
${hasExtraPoint ? `加點地址：${extraDistrict} ${extraAddress}\n` : ''}車型：${carType}
人數：大${adults}, 小(4-12)${children}, 幼(4歲以下)${infants}
行李：登機箱${carryOn}, 託運(21-29吋)${checkedBag}
預估總額：${estimatedTotal ? '$'+estimatedTotal : '待報價'} (${payment})
${remarks ? `備註：\n${remarks}` : ''}${extraSignboard ? `\n舉牌：${signboardText}` : ''}`;

        const payload = {
          action: 'addReservation',
          data: {
            reservationId, name: `${name} ${title}`, phone, email, date, time: `'${timeHour}:${timeMinute}`,
            serviceType, airport, flightNumber, district, address, carType, 
            luggage: `登機箱:${carryOn}, 託運:${checkedBag}`, payment, totalFee: estimatedTotal || '待報價',
            remarks: `${remarks}${extraSignboard ? ` [舉牌:${signboardText}]` : ''}`, timestamp: new Date().toLocaleString()
          }
        };

        setConfirmData({ payload, lineText });
        showAlert(lineText, '請確認預約明細', 'confirm');
      };

      return (
        <div className="pb-10">
          <CustomModal 
            isOpen={modal.open} title={modal.title} message={modal.message} type={modal.type} isSubmitting={isSubmitting}
            onClose={() => setModal({ open: false, title: '', message: '', type: 'info' })} 
            onConfirm={() => {
              if (modal.type === 'confirm' && confirmData) {
                setModal({ open: false, title: '', message: '', type: 'info' });
                executeSubmit(confirmData.payload, confirmData.lineText);
              }
            }}
          />
          
          <header className="bg-[#0ABAB5] text-white p-4 sticky top-0 z-50 shadow-md flex justify-center items-center text-center">
            <h1 className="text-xl font-bold tracking-wider">RS專車接送 詢價/預約</h1>
            <button onClick={fetchPrices} className="absolute right-4"><RefreshCw className={`w-5 h-5 ${isLoadingPrices?'animate-spin':''}`} /></button>
          </header>

          <main className="max-w-md mx-auto mt-6 bg-white shadow-lg p-6 sm:p-8 sm:border border-gray-200">
            <form onSubmit={handleSubmit} className="space-y-6">
              <div className="bg-[#0ABAB5]/5 p-3 flex justify-between items-center border border-[#0ABAB5]/20">
                <span className="text-sm font-bold text-[#0ABAB5] flex items-center gap-2"><FileText className="w-4 h-4" /> 預約編號</span>
                <span className="font-mono text-sm font-bold text-[#0ABAB5]">{reservationId}</span>
              </div>

              <section className="space-y-4">
                <h2 className="text-lg font-bold border-b-2 border-[#0ABAB5] pb-2 flex items-center gap-2 text-[#0ABAB5]"><User className="w-5 h-5" /> 乘車人資訊</h2>
                <div className="flex gap-2">
                  <input type="text" className="flex-1 p-3 border rounded-sm outline-none focus:border-[#0ABAB5]" placeholder="真實姓名" value={name} onChange={e=>setName(e.target.value)} />
                  <select className="p-3 border rounded-sm outline-none focus:border-[#0ABAB5]" value={title} onChange={e=>setTitle(e.target.value)}><option>先生</option><option>小姐</option></select>
                </div>
                <input type="tel" className="w-full p-3 border rounded-sm font-mono outline-none focus:border-[#0ABAB5]" placeholder="聯絡電話 0900-000-000" value={phone} onChange={handlePhoneChange} />
                <input type="email" className="w-full p-3 border rounded-sm outline-none focus:border-[#0ABAB5]" placeholder="MAIL 電子信箱" value={email} onChange={e=>setEmail(e.target.value)} />

                <div className="pt-2 border-t border-gray-100 mt-2 relative">
                  <label className="block text-base font-bold text-gray-700 mb-1 flex items-center gap-1"><MapPin className="w-4 h-4 text-[#0ABAB5]" /> 接送地址</label>
                  <input type="text" className="w-full p-3 border bg-gray-50 text-gray-500 rounded-sm mb-2 cursor-not-allowed" value={district} readOnly placeholder="區域區號 (由下方自動帶入)" />
                  <input ref={addressInputRef} type="text" className="w-full p-3 border bg-[#0ABAB5]/5 font-bold rounded-sm mb-4 outline-none focus:border-[#0ABAB5]" value={address} onChange={e=>setAddress(e.target.value)} placeholder="輸入詳細地址 (點選自動帶入區號)" />

                  <div className="mt-2 p-3 border border-dashed border-[#0ABAB5] rounded-sm">
                    <label className="flex items-center gap-2 cursor-pointer font-black text-[#0ABAB5] text-sm">
                      <input type="checkbox" className="w-5 h-5 accent-[#0ABAB5]" checked={hasExtraPoint} onChange={e=>setHasExtraPoint(e.target.checked)} />
                      <PlusCircle className="w-4 h-4" /> 需加點服務 (每點 +$100起)
                    </label>
                    <p className="text-[11px] text-red-500 font-bold ml-7 mt-1 animate-pulse-red">※ 加點上下車順序需由本公司安排。</p>
                    {hasExtraPoint && (
                      <div className="mt-4 space-y-2 animate-in slide-in-from-top-2">
                        <input type="text" className="w-full p-3 border bg-gray-50 text-gray-500 rounded-sm" value={extraDistrict} readOnly placeholder="加點區域" />
                        <input ref={extraAddressInputRef} type="text" className="w-full p-3 border bg-[#0ABAB5]/5 font-bold rounded-sm" value={extraAddress} onChange={e=>setExtraAddress(e.target.value)} placeholder="加點詳細地址 (點選帶入)" />
                      </div>
                    )}
                  </div>
                </div>
              </section>

              <section className="space-y-4">
                <h2 className="text-lg font-bold border-b-2 border-[#0ABAB5] pb-2 flex items-center gap-2 mt-8 text-[#0ABAB5]"><Calendar className="w-5 h-5" /> 乘車資訊</h2>
                <input type="date" className="w-full p-3 border rounded-sm outline-none focus:border-[#0ABAB5]" value={date} onChange={e=>setDate(e.target.value)} />
                <div className="flex gap-2">
                  <select className="flex-1 p-3 border bg-white rounded-sm" value={timeHour} onChange={e=>setTimeHour(e.target.value)}>{Array.from({length:24},(_,i)=>i.toString().padStart(2,'0')).map(h=><option key={h} value={h}>{h}</option>)}</select>
                  <select className="flex-1 p-3 border bg-white rounded-sm" value={timeMinute} onChange={e=>setTimeMinute(e.target.value)}>{Array.from({length:12},(_,i)=>(i*5).toString().padStart(2,'0')).map(m=><option key={m} value={m}>{m}</option>)}</select>
                </div>
                <div className="grid grid-cols-2 gap-4">
                  <select className="p-3 border font-bold rounded-sm" value={serviceType} onChange={e=>setServiceType(e.target.value)}><option value="送機">送機</option><option value="接機">接機 (+$200)</option></select>
                  <select className="p-3 border font-bold rounded-sm" value={airport} onChange={e=>setAirport(e.target.value)}><option>桃園機場</option><option>松山機場</option><option>台中機場</option></select>
                </div>
                <input type="text" className="w-full p-3 border uppercase font-mono rounded-sm outline-none focus:border-[#0ABAB5]" value={flightNumber} onChange={handleFlightChange} placeholder="航班編號 EX: BR123" />
              </section>

              <section className="space-y-4">
                <h2 className="text-lg font-bold border-b-2 border-[#0ABAB5] pb-2 flex items-center gap-2 mt-8 text-[#0ABAB5]">
                  <Car className="w-5 h-5" /> 車型與人數行李 <span className="text-red-500 text-xs font-bold">(最多 6 人 6 件 **包含登機箱**)</span>
                </h2>
                <select className={`w-full p-3 border font-bold rounded-sm ${carTypeConstraint.isForced?'bg-[#0ABAB5]/5 text-[#0ABAB5] border-[#0ABAB5]/20 cursor-not-allowed':'bg-white'}`} value={carType} onChange={e => !carTypeConstraint.isForced && setCarType(e.target.value)} disabled={carTypeConstraint.isForced}>
                  <option value="小車">小車</option><option value="大車">大車</option>
                </select>
                <div className="grid grid-cols-3 gap-2 text-center text-[11px] font-bold text-gray-700">
                  <div>大人<select className="w-full p-3 border" value={adults} onChange={e=>setAdults(Number(e.target.value))}>{Array.from({length:7},(_,i)=>i).filter(n=>n>0).map(i=><option key={i} value={i}>{i}</option>)}</select></div>
                  <div>小孩(4-12歲)<select className="w-full p-3 border" value={children} onChange={e=>setChildren(Number(e.target.value))}>{Array.from({length:7},(_,i)=>i).map(i=><option key={i} value={i}>{i}</option>)}</select></div>
                  <div>幼童(4歲以下)<select className="w-full p-3 border" value={infants} onChange={e=>setInfants(Number(e.target.value))}>{Array.from({length:7},(_,i)=>i).map(i=><option key={i} value={i}>{i}</option>)}</select></div>
                </div>
                <div className="grid grid-cols-2 gap-2 text-center text-[11px] font-bold text-gray-700">
                  <div>登機箱<select className="w-full p-3 border" value={carryOn} onChange={e=>setCarryOn(Number(e.target.value))}>{Array.from({length:7},(_,i)=>i).map(i=><option key={i} value={i}>{i}</option>)}</select></div>
                  <div>託運(21-29吋)<select className="w-full p-3 border" value={checkedBag} onChange={e=>setCheckedBag(Number(e.target.value))}>{Array.from({length:7},(_,i)=>i).map(i=><option key={i} value={i}>{i}</option>)}</select></div>
                </div>
              </section>

              <section className="space-y-4">
                <h2 className="text-lg font-bold border-b-2 border-[#0ABAB5] pb-2 flex items-center gap-2 mt-8 text-[#0ABAB5]"><CreditCard className="w-5 h-5" /> 費用報價</h2>
                <select className="w-full p-3 border font-bold rounded-sm outline-none focus:border-[#0ABAB5]" value={payment} onChange={e=>setPayment(e.target.value)}><option value="現金">現金</option><option value="轉帳">轉帳</option><option value="簽單月結">簽單月結</option></select>
                <div className="p-3 border rounded-sm">
                  <label className="flex items-center gap-2 cursor-pointer py-1 font-bold text-gray-700">
                    <input type="checkbox" className="w-5 h-5 accent-[#0ABAB5]" checked={extraSignboard} onChange={e=>setExtraSignboard(e.target.checked)} /> 舉牌服務 (+$200)
                  </label>
                  {extraSignboard && <input type="text" className="w-full mt-2 p-3 border rounded-sm outline-none focus:border-[#0ABAB5]" placeholder="輸入舉牌內容" value={signboardText} onChange={e=>setSignboardText(e.target.value)} />}
                </div>

                <div className="bg-[#0ABAB5] text-white p-6 border-t-8 border-white/20 rounded-sm shadow-xl">
                  <h3 className="text-sm font-black border-b border-white/20 pb-2 mb-4 flex items-center gap-2 uppercase tracking-widest"><FileText className="w-4 h-4" /> 報價明細內容</h3>
                  <div className="space-y-4 font-mono">
                    <div className="flex justify-between items-start">
                      <div className="flex flex-col">
                        <span className="font-bold text-base text-white">基本車資 ({carType})</span>
                        <span className="text-xs text-white/70">{basePriceInfo.name || '未選'} - {airport}</span>
                      </div>
                      <span className="font-bold text-xl text-white">{basePriceInfo.price ? `$${basePriceInfo.price}` : '待報價'}</span>
                    </div>
                    <div className="border-t border-dashed border-white/30 pt-4 space-y-2.5">
                      {fees.pickupFee > 0 && <div className="flex justify-between text-base font-bold text-white/90"><span>└ 接機服務費</span><span>+$200</span></div>}
                      {fees.nightFee > 0 && <div className="flex justify-between text-base font-bold text-white/90"><span>└ 夜間加成 (22-06)</span><span>+$200</span></div>}
                      {fees.infantSeatFee > 0 && <div className="flex justify-between text-base font-bold text-white/90"><span>└ 安全座椅 x {infants}</span><span>+${fees.infantSeatFee}</span></div>}
                      {fees.signboardFee > 0 && <div className="flex justify-between text-base font-bold text-white/90"><span>└ 機場舉牌服務</span><span>+$200</span></div>}
                      {fees.extraPointFee > 0 && <div className="flex justify-between text-base font-bold text-white/90"><span>└ 加點服務費</span><span>+${fees.extraPointFee}</span></div>}
                    </div>
                    <div className="mt-8 pt-5 border-t-2 border-white/30 flex justify-between items-center">
                      <span className="font-black text-white text-lg">預估總額</span>
                      <div className="text-right">
                        <span className="text-4xl font-black text-white">{estimatedTotal ? `$${estimatedTotal}` : '待報價'}</span>
                        <div className="text-xs text-white/70 mt-1 uppercase tracking-tighter">付款：{payment}</div>
                      </div>
                    </div>
                  </div>
                </div>
              </section>

              <section className="mt-8 border-t-2 border-[#0ABAB5] pt-6">
                <div className="bg-[#0ABAB5]/5 p-4 h-80 overflow-y-auto text-xs text-gray-700 leading-relaxed justify-text border border-[#0ABAB5]/20 rounded-sm shadow-inner">
                  <h3 className="font-bold text-[#0ABAB5] mb-3 flex items-center gap-1 text-sm"><ShieldAlert className="w-4 h-4" /> 【注意事項】</h3>
                  <div className="space-y-4 font-bold text-gray-800">
                    <p>1、如預約時無加點行程、當天服務司機無法多停上下車點(車輛均有 GPS )請體諒司機無法私自增加停靠點若臨時多加上下車點，可以告知司機請司機回報公司後方可執行「臨時加點服務」。</p>
                    <p>2、依實際人數及行李件數尺寸預約車款。</p>
                    <p>3、為了行車安全及法規，乘車時請繫上安全帶，車內座位區、腳踏墊區不得放置行李(隨身行李背包除外)。預約時請評估行李箱大小決定車種，司機現場服務時遇實際件數與預約資料不符時，本公司有權利終止租用車輛拒絕服務且該趟行程將視同已使用。</p>
                    <p>4、為維護乘車品質，顧及每位貴賓權益，車內請勿飲食。</p>
                    <p>5、因應政府「小型車附載幼童安全乘坐實施及宣導辦法」規範：2 歲以下兒童乘坐小客車，需繫安全帶或使用安全座椅(增高墊)乘坐。嬰幼兒若在 0~4 歲且體重 18 公斤內，強制使用安全座椅。(此項目受法令規範，如未依實際需求數量加購與安裝安全椅/增高墊：所有一切責任(罰款)將由乘車人承擔。)</p>
                  </div>
                </div>
                <label className="flex items-start gap-3 cursor-pointer p-4 border border-[#0ABAB5] font-black text-sm bg-white active:bg-[#0ABAB5]/5 transition-colors rounded-sm shadow-sm mt-4">
                  <input type="checkbox" required className="w-6 h-6 mt-0.5 accent-[#0ABAB5]" checked={agreed} onChange={e=>setAgreed(e.target.checked)} />我同意以上資訊與免責聲明。
                </label>
              </section>
              
              <button type="submit" disabled={isSubmitting} className={`w-full py-5 text-xl font-black flex items-center justify-center gap-3 transition-all rounded-sm shadow-lg ${!isSubmitting ? 'bg-[#0ABAB5] text-white hover:opacity-90 active:scale-95':'bg-gray-300 text-gray-500 cursor-not-allowed'}`}>
                {isSubmitting ? '預約傳送中...' : '確認預約並送出'}
              </button>
            </form>
            <div className="mt-10 text-center border-t-4 border-[#0ABAB5] pt-8 pb-4">
              <p className="text-xl font-black mb-2 text-[#0ABAB5]">24H 預約服務電話</p>
              <a href="tel:0915926166" className="text-4xl sm:text-5xl font-black text-[#0ABAB5] hover:underline tracking-wider block font-black-stroke">0915-926-166</a>
            </div>
          </main>
        </div>
      );
    }
    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);
  </script>
</body>
</html>
