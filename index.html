<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>RS專車接送 詢價/預約</title>
  
  <script src="https://cdn.tailwindcss.com"></script>
  <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
  <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  
  <script>
    window.require = function(name) {
      if (name === 'react') return window.React;
      if (name === 'react-dom') return window.ReactDOM;
      return null;
    };
    window.module = { exports: {} };
    window.exports = window.module.exports;
    window.define = undefined;
  </script>

  <script src="https://unpkg.com/lucide-react@0.344.0/dist/umd/lucide-react.js"></script>

  <script>
    if (!window.lucideReact && window.module && window.module.exports && window.module.exports.Calendar) {
      window.lucideReact = window.module.exports;
    }
  </script>

  <style>
    .justify-text {
      text-align: justify;
      text-justify: inter-ideograph;
    }
    .font-black-stroke {
      -webkit-text-stroke: 1.5px #0ABAB5;
    }
    /* 自定義捲軸 */
    ::-webkit-scrollbar {
      width: 6px;
    }
    ::-webkit-scrollbar-thumb {
      background: #0ABAB5;
      border-radius: 10px;
    }
    /* 修正日期輸入框 placeholder 顯示 */
    input[type="date"].is-empty {
      color: transparent;
    }
    input[type="date"].is-empty::before {
      content: attr(placeholder);
      width: 100%;
      color: #9ca3af;
      display: block;
    }
    input[type="date"]:focus {
      color: inherit;
    }
    input[type="date"]:focus::before {
      display: none;
    }
  </style>
</head>
<body class="bg-gray-50 text-black font-sans">
  
  <div id="root"></div>

  <script type="text/babel">
    const { useState, useEffect, useMemo, useRef, useCallback } = React;
    
    // --- 核心工具函式 ---
    function generateReservationId() {
      const now = new Date();
      const dateStr = `${now.getFullYear()}${String(now.getMonth() + 1).padStart(2, '0')}${String(now.getDate()).padStart(2, '0')}`;
      const randomDigits = Math.floor(1000 + Math.random() * 9000);
      const chars = 'ABCDEFGHIJKLMNOPQRSTUVWXYZ';
      let randomChars = '';
      for (let i = 0; i < 3; i++) {
        randomChars += chars.charAt(Math.floor(Math.random() * chars.length));
      }
      return `RS${dateStr}${randomDigits}${randomChars}`;
    }

    const FallbackIcon = () => <span></span>;
    const { 
      Calendar = FallbackIcon, Clock = FallbackIcon, MapPin = FallbackIcon, Phone = FallbackIcon, User = FallbackIcon, Plane = FallbackIcon, Car = FallbackIcon, 
      Briefcase = FallbackIcon, Users = FallbackIcon, CreditCard = FallbackIcon, Mail = FallbackIcon, FileText = FallbackIcon, CheckCircle = FallbackIcon, 
      ShieldAlert = FallbackIcon, Receipt = FallbackIcon, Database = FallbackIcon, Send = FallbackIcon, RefreshCw = FallbackIcon, Search = FallbackIcon, X = FallbackIcon, AlertCircle = FallbackIcon, PlusCircle = FallbackIcon, Info = FallbackIcon
    } = window.lucideReact || {};

    const GAS_WEBAPP_URL = 'https://script.google.com/macros/s/AKfycbwbTEF9LBnj2RB7cKgaFujfwCfG15sCMfL7REds-3oTeWQ-FTHU8c_DRPGgsH6LRsAZ_w/exec';
    const GOOGLE_MAPS_API_KEY = 'AIzaSyAxYym5ZR8puPb0iiycHdwzTJTKH0Aears';
    const LINE_LIFF_ID = '2009792282-jfKXBZiE';

    function CustomModal({ isOpen, onClose, onConfirm, title, message, type = 'info', isSubmitting = false }) {
      if (!isOpen) return null;
      return (
        <div className="fixed inset-0 z-[999] flex items-center justify-center p-4 bg-black/60 backdrop-blur-sm text-center text-[#222]">
          <div className="bg-white w-full max-w-sm rounded-lg shadow-2xl overflow-hidden animate-in zoom-in-95 duration-200 flex flex-col max-h-[85vh]">
            <div className={`p-4 flex justify-between items-center text-white shrink-0 ${type === 'error' ? 'bg-red-500' : 'bg-[#0ABAB5]'}`}>
              <div className="flex items-center gap-2 font-bold tracking-wider uppercase text-sm">
                {type === 'error' ? <AlertCircle className="w-4 h-4" /> : 
                 type === 'confirm' ? <FileText className="w-4 h-4" /> :
                 <CheckCircle className="w-4 h-4" />}
                {title}
              </div>
              <button onClick={onClose} disabled={isSubmitting}><X className="w-5 h-5 opacity-70 hover:opacity-100" /></button>
            </div>
            <div className="p-6 flex-1 overflow-y-auto text-left text-sm">
              <div className="leading-relaxed font-bold whitespace-pre-wrap">{message}</div>
            </div>
            <div className="p-4 bg-white border-t border-gray-100 shrink-0 flex gap-2">
              <button 
                onClick={onConfirm || onClose} 
                disabled={isSubmitting} 
                className="flex-1 py-3 bg-[#0ABAB5] text-white font-black rounded-sm active:scale-95 transition-transform disabled:opacity-50 flex justify-center items-center gap-2"
              >
                確定
              </button>
            </div>
          </div>
        </div>
      );
    }

    function App() {
      const [reservationId] = useState(generateReservationId());
      const [name, setName] = useState('');
      const [title, setTitle] = useState('先生');
      const [phone, setPhone] = useState('');
      const [email, setEmail] = useState('');
      const [date, setDate] = useState('');
      const [timeHour, setTimeHour] = useState('12');
      const [timeMinute, setTimeMinute] = useState('00');
      const [serviceType, setServiceType] = useState('送機');
      const [flightNumber, setFlightNumber] = useState('');
      const [airport, setAirport] = useState('桃園機場');
      const [carType, setCarType] = useState('小車');
      const [carryOn, setCarryOn] = useState(0);
      const [checkedBag, setCheckedBag] = useState(0);
      const [adults, setAdults] = useState(1);
      const [children, setChildren] = useState(0);
      const [infants, setInfants] = useState(0);
      const [district, setDistrict] = useState('');
      const [address, setAddress] = useState('');
      const [hasExtraPoint, setHasExtraPoint] = useState(false);
      const [extraDistrict, setExtraDistrict] = useState('');
      const [extraAddress, setExtraAddress] = useState('');
      const [payment, setPayment] = useState('現金');
      const [remarks, setRemarks] = useState('');
      const [agreed, setAgreed] = useState(false);
      const [extraSignboard, setExtraSignboard] = useState(false);
      const [signboardText, setSignboardText] = useState('');
      const [priceMap, setPriceMap] = useState({});
      const [isLoadingPrices, setIsLoadingPrices] = useState(false);
      const [isSubmitting, setIsSubmitting] = useState(false);
      
      const [modal, setModal] = useState({ open: false, title: '', message: '', type: 'info', onConfirm: null });
      
      // ★ 狀態控制新增：用來徹底卸載表單與控制畫面切換
      const [isDone, setIsDone] = useState(false);
      const [submitSuccess, setSubmitSuccess] = useState(false);
      const [fallbackMessage, setFallbackMessage] = useState('');
      
      const addressInputRef = useRef(null);
      const extraAddressInputRef = useRef(null);

      const showAlert = useCallback((msg, title = '系統訊息', type = 'info', onConfirm = null) => {
        setModal({ open: true, title, message: msg, type, onConfirm });
      }, []);

      const handleFlightChange = (e) => {
        setFlightNumber(e.target.value.replace(/[^a-zA-Z0-9]/g, '').toUpperCase());
      };

      const handlePhoneChange = (e) => {
        let val = e.target.value.replace(/\D/g, '').slice(0, 10);
        let formatted = val;
        if (val.length > 7) formatted = `${val.slice(0, 4)}-${val.slice(4, 7)}-${val.slice(7)}`;
        else if (val.length > 4) formatted = `${val.slice(0, 4)}-${val.slice(4)}`;
        setPhone(formatted);
      };

      const loadLiff = useCallback(() => {
        return new Promise((resolve, reject) => {
          if (window.liff) return resolve(window.liff);
          const script = document.createElement('script');
          script.src = 'https://static.line-scdn.net/liff/edge/2/sdk.js';
          script.onload = () => resolve(window.liff);
          script.onerror = () => reject(new Error('被瀏覽器或擋廣告軟體阻擋'));
          document.head.appendChild(script);
        });
      }, []);

      useEffect(() => {
        const initLiff = async () => {
          try {
            const liffModule = await loadLiff();
            if (!liffModule.id) {
              await liffModule.init({ liffId: LINE_LIFF_ID });
            }
          } catch (err) {
            console.warn('LIFF Init Failed', err);
          }
        };
        initLiff();
        window.gm_authFailure = () => showAlert("地圖補全功能載入失敗，請手動輸入詳細地址。", "地圖服務", "error");
      }, [showAlert, loadLiff]);

      const totalPeople = useMemo(() => Number(adults) + Number(children) + Number(infants), [adults, children, infants]);
      const totalLuggage = useMemo(() => Number(carryOn) + Number(checkedBag), [carryOn, checkedBag]);

      const carTypeConstraint = useMemo(() => {
        if (totalLuggage >= 3 || totalPeople >= 5) {
          return { isForced: true, reason: totalLuggage >= 3 ? "行李達 3 件以上" : "人數達 5 人以上" };
        }
        return { isForced: false, reason: '' };
      }, [totalPeople, totalLuggage]);

      useEffect(() => {
        if (carTypeConstraint.isForced) setCarType('大車');
      }, [carTypeConstraint]);

      useEffect(() => {
        if (date && timeHour && timeMinute) {
          const selectedDate = new Date(`${date}T${timeHour}:${timeMinute}:00`);
          const now = new Date();
          if ((selectedDate.getTime() - now.getTime()) / (1000 * 60 * 60) < 24) {
            showAlert('預約需大於 24 小時，急件請直撥 0915-926-166。', '時間限制', 'error');
            setDate(''); 
          }
        }
      }, [date, timeHour, timeMinute, showAlert]);

      const parsePlaceToDistrictAndAddress = useCallback((place, distSetter, addrSetter) => {
        const components = place.address_components || [];
        const fullAddr = place.formatted_address || "";
        let zip = (components.find(c => c.types.includes('postal_code'))?.long_name || fullAddr.match(/(\d{3,5})/)?.[1] || "").substring(0, 3);
        let city = (components.find(c => c.types.includes('administrative_area_level_1'))?.long_name || "").replace(/\d+/g, '').replace('台灣', '').trim();
        let area = (components.find(c => c.types.includes('sublocality_level_1')) || components.find(c => c.types.includes('locality')))?.long_name || "";
        area = area.replace(/\d+/g, '').trim();

        if (fullAddr.includes("香山區")) { zip = "300"; city = "新竹市"; area = "香山區"; }
        else if (fullAddr.includes("東區") && (fullAddr.includes("新竹") || city.includes("新竹"))) { zip = "300"; city = "新竹市"; area = "東區"; }
        else if (fullAddr.includes("北區") && (fullAddr.includes("新竹") || city.includes("新竹"))) { zip = "300"; city = "新竹市"; area = "北區"; }
        else if (fullAddr.includes("竹南")) { zip = "350"; city = "苗栗縣"; area = "竹南鎮"; }
        else if (fullAddr.includes("頭份")) { zip = "350"; city = "苗栗縣"; area = "頭份市"; }
        else if (fullAddr.includes("竹北")) { zip = "302"; city = "新竹縣"; area = "竹北市"; }
        else if (fullAddr.includes("竹東")) { zip = "310"; city = "新竹縣"; area = "竹東鎮"; }

        distSetter(`${zip} ${city} ${area}`.replace(/\s+/g, ' ').trim());
        addrSetter(fullAddr.replace(/^台灣\d{3,5}\s*/, '').replace(/^台灣/, '').replace(city, '').replace(area, '').replace(/^\d{3,5}/, '').trim());
      }, []);

      useEffect(() => {
        const initAutocomplete = (ref, addrSetter, distSetter) => {
          if (ref.current && window.google?.maps?.places) {
            const autocomplete = new window.google.maps.places.Autocomplete(ref.current, { types: ['geocode', 'establishment'], componentRestrictions: { country: 'tw' } });
            autocomplete.addListener('place_changed', () => {
              const place = autocomplete.getPlace();
              if (place.formatted_address) parsePlaceToDistrictAndAddress(place, distSetter, addrSetter);
            });
          }
        };
        if (!window.google) {
          const script = document.createElement('script');
          script.src = `https://maps.googleapis.com/maps/api/js?key=${GOOGLE_MAPS_API_KEY}&libraries=places&language=zh-TW`;
          script.async = true; script.defer = true;
          script.onload = () => {
            initAutocomplete(addressInputRef, setAddress, setDistrict);
            if (hasExtraPoint) initAutocomplete(extraAddressInputRef, setExtraAddress, setExtraDistrict);
          };
          document.head.appendChild(script);
        } else {
          initAutocomplete(addressInputRef, setAddress, setDistrict);
          if (hasExtraPoint) initAutocomplete(extraAddressInputRef, setExtraAddress, setExtraDistrict);
        }
      }, [hasExtraPoint, parsePlaceToDistrictAndAddress]);

      useEffect(() => {
        (async () => {
          setIsLoadingPrices(true);
          try {
            const res = await fetch(`${GAS_WEBAPP_URL}?action=getPrices`);
            const d = await res.json();
            if (d.status === 'success') setPriceMap(d.prices);
          } catch(e) {} finally { setIsLoadingPrices(false); }
        })();
      }, []);

      const basePriceInfo = useMemo(() => {
        let p1 = 0, p2 = 0;
        if (district) { const d = priceMap[`${airport}_${district}`]; if(d) p1 = carType === '大車' ? d.large : d.small; }
        if (hasExtraPoint && extraDistrict) { const d = priceMap[`${airport}_${extraDistrict}`]; if(d) p2 = carType === '大車' ? d.large : d.small; }
        return (hasExtraPoint && p2 > p1) ? { price: p2, name: extraDistrict } : { price: p1, name: district };
      }, [priceMap, airport, district, extraDistrict, hasExtraPoint, carType]);

      const fees = useMemo(() => {
        const pickup = serviceType === '接機' ? 200 : 0;
        const h = parseInt(timeHour);
        const night = (h >= 22 || h < 6) ? 200 : 0;
        const extraPoint = (hasExtraPoint && district && extraDistrict) ? (district.substring(0, 3) === extraDistrict.substring(0, 3) ? 100 : 200) : 0;
        return { pickup, night, infant: infants * 200, signboard: extraSignboard ? 200 : 0, extraPoint };
      }, [serviceType, timeHour, infants, extraSignboard, hasExtraPoint, district, extraDistrict]);

      const estimatedTotal = useMemo(() => {
        const extra = Object.values(fees).reduce((a, b) => a + b, 0);
        return basePriceInfo.price > 0 ? basePriceInfo.price + extra : null;
      }, [basePriceInfo.price, fees]);


      // ★ 最關鍵的執行送出邏輯：極致自動化關閉 ★
      const executeSubmit = async (payload, lineText) => {
        if (isSubmitting) return;
        setIsSubmitting(true);
        try {
          // 1. 背景發送資料給 Google Apps Script
          fetch(GAS_WEBAPP_URL, { method: 'POST', mode: 'no-cors', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(payload) }).catch(e => console.log('GAS err:', e));

          const successNotice = "✅ 感謝您的線上預約！\n客服人員將會盡快為您安排專屬座車，並與您聯繫確認細節。有任何問題請隨時與我們聯繫！";

          // 2. 準備 LIFF
          let liffModule = window.liff;
          try {
             if (!liffModule) liffModule = await loadLiff();
             if (!liffModule.id) await liffModule.init({ liffId: LINE_LIFF_ID });
          } catch (e) {
             console.warn('LIFF 載入失敗', e);
          }

          // 3. 判斷環境，執行最終發送
          if (liffModule && liffModule.isInClient()) {
              try {
                  // 在 LINE 內部，傳送兩段對話
                  await liffModule.sendMessages([
                      { type: 'text', text: lineText },
                      { type: 'text', text: successNotice }
                  ]);
                  
                  // 【重點】：直接切換為徹底關閉畫面，阻斷表單
                  setIsDone(true);
                  
                  // 【重點】：不彈出任何視窗、不用按確定，直接呼叫關閉！
                  liffModule.closeWindow();
                  return; // 立即結束函式，不讓畫面有機會復活
                  
              } catch (err) {
                  // 只有在權限不足傳送失敗時，才顯示錯誤畫面
                  setFallbackMessage(`⚠️ LINE 傳送權限被阻擋，請確認後台設定。\n明細已記錄：\n\n${lineText}\n\n${successNotice}`);
                  setSubmitSuccess(true);
              }
          } else {
              // 在手機外部瀏覽器 (Safari/Chrome)
              setFallbackMessage(`實際預約明細如下：\n\n${lineText}\n\n${successNotice}`);
              setSubmitSuccess(true);
              window.scrollTo({ top: 0, behavior: 'smooth' });
          }
        } catch (err) { 
          showAlert('資料傳送過程中發生錯誤，請檢查網路連線。', '系統錯誤', 'error'); 
        } finally { 
          setIsSubmitting(false); 
        }
      };

      const handleSubmit = (e) => {
        e.preventDefault();
        const missing = [];
        
        if (!name.trim()) missing.push('乘車人全名');
        if (phone.replace(/\D/g, '').length !== 10) missing.push('聯絡電話 (需完整10碼)');
        if (!email.trim()) missing.push('電子信箱 (MAIL)');
        else if (!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email)) missing.push('信箱格式錯誤');
        if (!district) missing.push('接送區域 (請透過地圖選取)');
        if (!address.trim()) missing.push('詳細地址');
        if (hasExtraPoint) {
          if (!extraDistrict) missing.push('加點區域 (請透過地圖選取)');
          if (!extraAddress.trim()) missing.push('加點詳細地址');
        }
        if (!date) missing.push('乘車日期');
        if (!flightNumber.trim()) missing.push('航班編號');
        if (extraSignboard && !signboardText.trim()) missing.push('舉牌服務內容');
        if (totalPeople > 6) missing.push(`人數總計不可超過 6 位 (目前: ${totalPeople}位)`);
        if (totalLuggage > 6) missing.push(`行李總計不可超過 6 件 (目前: ${totalLuggage}件)`);

        if (missing.length > 0) {
          return showAlert(`請確認以下欄位是否已填寫正確：\n\n• ${missing.join('\n• ')}`, '資料尚未填妥', 'error');
        }
        if (!agreed) {
          return showAlert('請先閱讀並勾選最下方的「我同意以上資訊與免責聲明」後再送出預約。', '提醒', 'error');
        }

        const lineText = `【RS專車接送 線上預約單】\n預約編號：${reservationId}\n全名：${name} ${title}\n電話：${phone}\n日期：${date}\n時間：${timeHour}:${timeMinute}\n服務：${serviceType}\n機場：${airport}\n航班：${flightNumber}\n地址：${district} ${address}\n${hasExtraPoint ? `加點：${extraDistrict} ${extraAddress}\n` : ''}車型：${carType}\n人數：大${adults},小${children},幼${infants}\n行李：登機箱${carryOn},託運${checkedBag}\n總額：${estimatedTotal ? '$'+estimatedTotal : '待報價'} (${payment})`;
        const payload = { action: 'addReservation', data: { reservationId, name: `${name} ${title}`, phone, email, date, time: `'${timeHour}:${timeMinute}`, serviceType, airport, flightNumber, district, address, carType, luggage: `登機:${carryOn},託運:${checkedBag}`, payment, totalFee: estimatedTotal || '待報價', remarks: `${remarks}${extraSignboard ? ` [舉牌:${signboardText}]` : ''}`, timestamp: new Date().toLocaleString() } };
        
        // 直接執行發送！
        executeSubmit(payload, lineText);
      };

      const renderOptions = (currentOtherSum, max, excludeZero = false) => {
        const available = Math.max(0, max - currentOtherSum);
        return Array.from({length: available + 1}, (_, i) => i).filter(n => !(excludeZero && n === 0)).map(i => <option key={i} value={i}>{i}</option>);
      };


      // ★ 畫面渲染：LINE 內部成功秒關的「純色過場」，絕對不顯示表單
      if (isDone) {
        return (
          <div className="min-h-screen bg-[#0ABAB5] flex flex-col items-center justify-center text-white animate-in fade-in duration-300">
             <CheckCircle className="w-20 h-20 mb-4 animate-pulse" />
             <h2 className="text-2xl font-black tracking-widest">預約已送出</h2>
             <p className="mt-4 font-bold opacity-90">正在為您返回 LINE 聊天室...</p>
             <p className="mt-2 text-xs opacity-60">(若畫面未自動關閉，請點擊右上角 X)</p>
          </div>
        );
      }

      // ★ 畫面渲染：外部瀏覽器（非 LINE APP）的靜態成功畫面，清楚告知原因
      if (submitSuccess) {
        return (
          <div className="pb-10 text-[#222] min-h-screen bg-gray-50 flex flex-col">
            <header className="bg-[#0ABAB5] text-white p-4 sticky top-0 z-50 shadow-md flex justify-center items-center text-center">
              <h1 className="text-xl font-bold tracking-wider uppercase">預約完成</h1>
            </header>
            <main className="max-w-md w-full mx-auto mt-8 p-6 animate-in slide-in-from-bottom-4 duration-500">
              <div className="bg-white p-8 rounded-lg shadow-xl text-center border border-gray-100">
                <CheckCircle className="w-20 h-20 text-[#0ABAB5] mx-auto mb-4" />
                <h2 className="text-2xl font-black text-[#0ABAB5] mb-2">預約資料已送出</h2>
                
                <div className="bg-red-50 text-red-600 p-4 rounded-md mb-6 mt-6 text-[13px] font-bold text-left border border-red-100 leading-relaxed">
                   💡 系統提示：<br/>因為您目前使用手機的一般瀏覽器 (如 Safari/Chrome)，手機安全限制無法自動關閉網頁。<br/><br/>👉 <span className="underline">請您直接「滑掉此網頁」切換回 LINE 即可！</span>
                </div>

                <div className="text-left bg-gray-50 border border-gray-200 p-4 rounded-md text-[12px] text-gray-500 font-mono whitespace-pre-wrap overflow-y-auto max-h-[30vh]">
                  {fallbackMessage}
                </div>
              </div>
            </main>
          </div>
        );
      }

      // ★ 畫面渲染：正常表單
      return (
        <div className="pb-10 text-[#222]">
          <CustomModal 
            isOpen={modal.open} title={modal.title} message={modal.message} type={modal.type} isSubmitting={isSubmitting} 
            onClose={() => setModal({ open: false, title: '', message: '', type: 'info', onConfirm: null })} 
            onConfirm={() => setModal({ open: false, title: '', message: '', type: 'info', onConfirm: null })} 
          />
          
          <header className="bg-[#0ABAB5] text-white p-4 sticky top-0 z-50 shadow-md flex justify-center items-center text-center">
            <h1 className="text-xl font-bold tracking-wider uppercase">RS 專車接送 預約系統</h1>
            <button onClick={() => window.location.reload()} className="absolute right-4"><RefreshCw className={`w-5 h-5 ${isLoadingPrices?'animate-spin':''}`} /></button>
          </header>

          <main className="max-w-md mx-auto mt-6 bg-white shadow-lg p-6 sm:p-8 sm:border border-gray-200">
            <form onSubmit={handleSubmit} className="space-y-6">
              <div className="bg-[#0ABAB5]/5 p-3 flex justify-between items-center border border-[#0ABAB5]/20">
                <span className="text-sm font-bold text-[#0ABAB5] flex items-center gap-2"><FileText className="w-4 h-4" /> 預約編號</span>
                <span className="font-mono text-sm font-bold text-[#0ABAB5]">{reservationId}</span>
              </div>

              <section className="space-y-4">
                <h2 className="text-lg font-bold border-b-2 border-[#0ABAB5] pb-2 flex items-center gap-2 text-[#0ABAB5]"><User className="w-5 h-5" /> 乘車人資訊</h2>
                <div className="flex gap-2">
                  <input type="text" className="flex-1 p-3 border rounded-sm outline-none focus:border-[#0ABAB5] bg-white text-base" placeholder="全名" value={name} onChange={e=>setName(e.target.value)} />
                  <select className="p-3 border rounded-sm outline-none focus:border-[#0ABAB5] bg-white text-base" value={title} onChange={e=>setTitle(e.target.value)}><option>先生</option><option>小姐</option></select>
                </div>
                <input type="tel" className="w-full p-3 border rounded-sm font-mono outline-none focus:border-[#0ABAB5] bg-white text-base" placeholder="聯絡電話 0900-000-000" value={phone} onChange={handlePhoneChange} />
                <input type="email" className="w-full p-3 border rounded-sm outline-none focus:border-[#0ABAB5] bg-white text-base" placeholder="MAIL 電子信箱" value={email} onChange={e=>setEmail(e.target.value)} />

                <div className="pt-2 border-t border-gray-100 mt-2 relative">
                  <label className="block text-base font-bold text-gray-700 mb-1 flex items-center gap-1"><MapPin className="w-4 h-4 text-[#0ABAB5]" /> 接送地址</label>
                  <input type="text" className="w-full p-3 border bg-gray-50 text-gray-500 rounded-sm mb-2 cursor-not-allowed font-bold text-sm" value={district} readOnly placeholder="郵遞區號 縣市 區域 (自動解析)" />
                  <input ref={addressInputRef} type="text" className="w-full p-3 border bg-[#0ABAB5]/5 font-bold rounded-sm mb-4 outline-none focus:border-[#0ABAB5] text-base" value={address} onChange={e=>setAddress(e.target.value)} placeholder="輸入詳細地址 (點選自動帶入區號)" />

                  <div className="mt-2 p-3 border border-dashed border-[#0ABAB5] rounded-sm">
                    <label className="flex items-center gap-2 cursor-pointer font-black text-[#0ABAB5] text-sm">
                      <input type="checkbox" className="w-5 h-5 accent-[#0ABAB5]" checked={hasExtraPoint} onChange={e=>setHasExtraPoint(e.target.checked)} />
                      <PlusCircle className="w-4 h-4" /> 需加點服務 (每點 +$100起)
                    </label>
                    <p className="text-[11px] text-red-600 font-bold ml-7 mt-1">※ 加點上下車順序需由本公司安排。</p>
                    {hasExtraPoint && (
                      <div className="mt-4 space-y-2 animate-in slide-in-from-top-2">
                        <input type="text" className="w-full p-3 border bg-gray-50 text-gray-500 rounded-sm font-bold text-sm" value={extraDistrict} readOnly placeholder="加點區域" />
                        <input ref={extraAddressInputRef} type="text" className="w-full p-3 border bg-[#0ABAB5]/5 font-bold rounded-sm text-base" value={extraAddress} onChange={e=>setExtraAddress(e.target.value)} placeholder="加點詳細地址 (點選帶入)" />
                      </div>
                    )}
                  </div>
                </div>
              </section>

              <section className="space-y-4">
                <h2 className="text-lg font-bold border-b-2 border-[#0ABAB5] pb-2 flex items-center gap-2 mt-8 text-[#0ABAB5]"><Calendar className="w-5 h-5" /> 乘車資訊</h2>
                <label className="block text-sm font-bold text-gray-700">乘車日期</label>
                <input type="date" className={`w-full p-3 border rounded-sm outline-none focus:border-[#0ABAB5] bg-white text-base ${!date ? 'is-empty' : ''}`} value={date} onChange={e=>setDate(e.target.value)} placeholder="請輸入乘車日期 (西元年/月/日)" />
                <div className="flex gap-2">
                  <select className="flex-1 p-3 border bg-white rounded-sm text-base" value={timeHour} onChange={e=>setTimeHour(e.target.value)}>{Array.from({length:24},(_,i)=>i.toString().padStart(2,'0')).map(h=><option key={h} value={h}>{h}</option>)}</select>
                  <select className="flex-1 p-3 border bg-white rounded-sm text-base" value={timeMinute} onChange={e=>setTimeMinute(e.target.value)}>{Array.from({length:12},(_,i)=>(i*5).toString().padStart(2,'0')).map(m=><option key={m} value={m}>{m}</option>)}</select>
                </div>
                <div className="grid grid-cols-2 gap-4">
                  <select className="p-3 border font-bold rounded-sm bg-white text-base" value={serviceType} onChange={e=>setServiceType(e.target.value)}><option value="送機">送機</option><option value="接機">接機 (+$200)</option></select>
                  <select className="p-3 border font-bold rounded-sm bg-white text-base" value={airport} onChange={e=>setAirport(e.target.value)}><option>桃園機場</option><option>松山機場</option><option>台中機場</option></select>
                </div>
                <input type="text" className="w-full p-3 border uppercase font-mono rounded-sm outline-none focus:border-[#0ABAB5] bg-white text-base" value={flightNumber} onChange={handleFlightChange} placeholder="航班編號 EX: BR123" />
              </section>

              <section className="space-y-4">
                <h2 className="text-lg font-bold border-b-2 border-[#0ABAB5] pb-2 flex items-center gap-2 mt-8 text-[#0ABAB5]">
                  <Car className="w-5 h-5" /> 車型與人數行李 <span className="text-red-500 text-[10px] font-bold">(最多 6 人 6 件 **包含登機箱**)</span>
                </h2>
                <select className={`w-full p-3 border font-bold rounded-sm ${carTypeConstraint.isForced?'bg-[#0ABAB5]/5 text-[#0ABAB5] border-[#0ABAB5]/20 cursor-not-allowed':'bg-white'} text-base`} value={carType} onChange={e => !carTypeConstraint.isForced && setCarType(e.target.value)} disabled={carTypeConstraint.isForced}>
                  <option value="小車">小車</option><option value="大車">大車</option>
                </select>
                {carTypeConstraint.isForced && (
                  <p className="text-[11px] font-bold text-red-600">
                    ※ 因 {carTypeConstraint.reason}，系統已強制改為大車。
                  </p>
                )}
                <div className="grid grid-cols-3 gap-2 text-center text-[11px] font-bold text-gray-700">
                  <div>大人<select className="w-full p-3 border bg-white text-base" value={adults} onChange={e=>setAdults(Number(e.target.value))}>{renderOptions(children+infants, 6, true)}</select></div>
                  <div>小孩(4-12歲)<select className="w-full p-3 border bg-white text-base" value={children} onChange={e=>setChildren(Number(e.target.value))}>{renderOptions(adults+infants, 6)}</select></div>
                  <div>幼童(4歲以下)<select className="w-full p-3 border bg-white text-base" value={infants} onChange={e=>setInfants(Number(e.target.value))}>{renderOptions(adults+children, 6)}</select></div>
                </div>
                <div className="grid grid-cols-2 gap-2 text-center text-[11px] font-bold text-gray-700">
                  <div>登機箱<select className="w-full p-3 border bg-white text-base" value={carryOn} onChange={e=>setCarryOn(Number(e.target.value))}>{renderOptions(checkedBag, 6)}</select></div>
                  <div>託運(21-29吋)<select className="w-full p-3 border bg-white text-base" value={checkedBag} onChange={e=>setCheckedBag(Number(e.target.value))}>{renderOptions(carryOn, 6)}</select></div>
                </div>
              </section>

              <section className="space-y-4">
                <h2 className="text-lg font-bold border-b-2 border-[#0ABAB5] pb-2 flex items-center gap-2 mt-8 text-[#0ABAB5]"><CreditCard className="w-5 h-5" /> 費用報價</h2>
                <select className="w-full p-3 border font-bold rounded-sm outline-none focus:border-[#0ABAB5] bg-white text-base" value={payment} onChange={e=>setPayment(e.target.value)}><option value="現金">現金</option><option value="轉帳">轉帳</option><option value="簽單月結">簽單月結</option></select>
                <div className="p-3 border rounded-sm">
                  <label className="flex items-center gap-2 cursor-pointer py-1 font-bold text-gray-700">
                    <input type="checkbox" className="w-5 h-5 accent-[#0ABAB5]" checked={extraSignboard} onChange={e=>setExtraSignboard(e.target.checked)} /> 舉牌服務 (+$200)
                  </label>
                  {extraSignboard && <input type="text" className="w-full mt-2 p-3 border rounded-sm outline-none focus:border-[#0ABAB5] bg-white text-base" placeholder="輸入舉牌內容" value={signboardText} onChange={e=>setSignboardText(e.target.value)} />}
                </div>

                <div className="bg-[#0ABAB5] text-white p-6 border-t-8 border-white/20 rounded-sm shadow-xl">
                  <h3 className="text-sm font-black border-b border-white/20 pb-2 mb-4 flex items-center gap-2 uppercase tracking-widest"><FileText className="w-4 h-4" /> 報價明細內容</h3>
                  <div className="space-y-4 font-mono">
                    <div className="flex justify-between items-start">
                      <div className="flex flex-col">
                        <span className="font-bold text-base text-white">基本車資 ({carType})</span>
                        <span className="text-xs text-white/70">
                          {serviceType === '接機' 
                            ? `${airport} - ${basePriceInfo.name || '未選'}` 
                            : `${basePriceInfo.name || '未選'} - ${airport}`}
                        </span>
                      </div>
                      <span className="font-bold text-xl text-white">{basePriceInfo.price ? `$${basePriceInfo.price}` : '待報價'}</span>
                    </div>
                    <div className="border-t border-dashed border-white/30 pt-4 space-y-2.5">
                      {fees.pickup > 0 && <div className="flex justify-between text-base font-bold text-white/90"><span>└ 接機服務費</span><span>+$200</span></div>}
                      {fees.night > 0 && <div className="flex justify-between text-base font-bold text-white/90"><span>└ 夜間加成 (22-06)</span><span>+$200</span></div>}
                      {fees.infant > 0 && <div className="flex justify-between text-base font-bold text-white/90"><span>└ 安全座椅 x {infants}</span><span>+${fees.infant}</span></div>}
                      {fees.signboard > 0 && <div className="flex justify-between text-base font-bold text-white/90"><span>└ 機場舉牌服務</span><span>+$200</span></div>}
                      {fees.extraPoint > 0 && <div className="flex justify-between text-base font-bold text-white/90"><span>└ 加點服務費</span><span>+${fees.extraPoint}</span></div>}
                    </div>
                    <div className="mt-8 pt-5 border-t-2 border-white/30 flex justify-between items-center">
                      <span className="font-black text-white text-lg">預估總額</span>
                      <div className="text-right">
                        <span className="text-4xl font-black text-white">{estimatedTotal ? `$${estimatedTotal}` : '待報價'}</span>
                        <div className="text-xs text-white/70 mt-1 uppercase tracking-tighter">付款：{payment}</div>
                      </div>
                    </div>
                  </div>
                </div>
              </section>

              <section className="mt-8 border-t-2 border-[#0ABAB5] pt-6">
                <div className="bg-[#0ABAB5]/5 p-4 h-80 overflow-y-auto text-xs text-gray-700 leading-relaxed justify-text border border-[#0ABAB5]/20 rounded-sm shadow-inner">
                  <h3 className="font-bold text-[#0ABAB5] mb-3 flex items-center gap-1 text-sm"><ShieldAlert className="w-4 h-4" /> 【注意事項】</h3>
                  <div className="space-y-4 font-bold text-gray-800">
                    <p>1、如預約時無加點行程、當天服務司機無法多停上下車點(車輛均有 GPS )請體諒司機無法私自增加停靠點若臨時多加上下車點，可以告知司機請司機回報公司後方可執行「臨時加點服務」。</p>
                    <p>2、依實際人數及行李件數尺寸預約車款。</p>
                    <p>3、為了行車安全及法規，乘車時請繫上安全帶，車內座位區、腳踏墊區不得放置行李(隨身行李背包除外)。預約時請評估行李箱大小決定車種，司機現場服務時遇實際件數與預約資料不符時，本公司有權利終止租用車輛拒絕服務且該趟行程將視同已使用。</p>
                    <p>4、為維護乘車品質，顧及每位貴賓權益，車內請勿飲食。</p>
                    <p>5、因應政府「小型車附載幼童安全乘坐實施及宣導辦法」規範：2 歲以下兒童乘坐小客車，需繫安全帶或使用安全座椅(增高墊)乘坐。嬰幼兒若在 0~4 歲且體重 18 公斤內，強制使用安全座椅。(此項目受法令規範，如未依實際需求數量加購與安裝安全椅/增高墊：所有一切責任(罰款)將由乘車人承擔。)</p>
                  </div>
                </div>
                <label className="flex items-start gap-3 cursor-pointer p-4 border border-[#0ABAB5] font-black text-sm bg-white active:bg-[#0ABAB5]/5 transition-colors rounded-sm shadow-sm mt-4">
                  <input type="checkbox" className="w-6 h-6 mt-0.5 accent-[#0ABAB5]" checked={agreed} onChange={e=>setAgreed(e.target.checked)} />我同意以上資訊與免責聲明。
                </label>
              </section>
              
              <button type="submit" disabled={isSubmitting} className={`w-full py-5 text-xl font-black flex items-center justify-center gap-3 transition-all rounded-sm shadow-lg ${!isSubmitting ? 'bg-[#0ABAB5] text-white hover:opacity-90 active:scale-95':'bg-gray-300 text-gray-500 cursor-not-allowed'}`}>
                {isSubmitting ? '預約傳送中...' : '確認預約並送出'}
              </button>
            </form>
            <div className="mt-10 text-center border-t-4 border-[#0ABAB5] pt-8 pb-4">
              <p className="text-xl font-black mb-2 text-[#0ABAB5]">24H 預約服務電話</p>
              <a href="tel:0915926166" className="text-4xl sm:text-5xl font-black text-[#0ABAB5] hover:underline tracking-wider block font-black-stroke">0915-926-166</a>
            </div>
          </main>
        </div>
      );
    }
    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);
  </script>
</body>
</html>
